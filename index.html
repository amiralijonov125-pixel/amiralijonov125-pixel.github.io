  'Проблема': ['Мушкилот', 'The problem'], 'Решение': ['Ҳал', 'The solution'], 'Оригинальность': ['Асолат', 'Originality'], 'Профили': ['Профилҳо', 'Profiles'], 'Атмосфера': ['Фазо', 'Atmosphere'],
  'Языки': ['Забонҳо', 'Languages'], 'Как устроено': ['Чӣ тавр сохта шудааст', 'How it works'], 'Что дальше': ['Минбаъд чӣ', 'What’s next'],
  'Книги преподавателей теряются': ['Китобҳои омӯзгорон гум мешаванд', 'Teachers’ books get lost'],
  'Преподаватели пишут учебники, эссе и стихи, но тексты лежат в папках и мессенджерах. Студентам трудно их найти, а проверить, не переписан ли текст у другого автора, почти невозможно.': ['Омӯзгорон китобҳои дарсӣ, эссе ва шеър менависанд, аммо матнҳо дар ҷузвдонҳо ва паёмрасонҳо мемонанд. Донишҷӯён онҳоро душвор меёбанд, санҷидани он ки матн аз муаллифи дигар рӯбардор нашудааст, қариб ғайриимкон аст.', 'Teachers write textbooks, essays and poems, but the texts sit in folders and messengers. Students struggle to find them, and checking whether a text was copied from another author is almost impossible.'],
  'Разбросано по папкам': ['Дар ҷузвдонҳо пароканда', 'Scattered across folders'], 'Трудно найти нужное': ['Ёфтани лозимӣ душвор', 'Hard to find'], 'Плагиат не проверяется': ['Плагиат санҷида намешавад', 'No plagiarism check'], 'Негде обсудить': ['Ҷои муҳокима нест', 'Nowhere to discuss'],
  'Одна библиотека для всего университета': ['Як китобхона барои тамоми донишгоҳ', 'One library for the whole university'], 'Публикуй': ['Нашр кун', 'Publish'], 'Проверяй': ['Санҷ', 'Check'], 'Обсуждай': ['Муҳокима кун', 'Discuss'],
  'Книги, эссе и стихи — прямо на сайте или файлом PDF и TXT.': ['Китоб, эссе ва шеър — бевосита дар сайт ё бо файли PDF ва TXT.', 'Books, essays and poems — right on the site or as PDF and TXT files.'],
  'Каждая работа проходит проверку на оригинальность перед публикацией.': ['Ҳар асар пеш аз нашр аз санҷиши асолат мегузарад.', 'Every work is checked for originality before publishing.'],
  'Отзывы, оценки, общий чат и личные сообщения.': ['Тақризҳо, баҳоҳо, чати умумӣ ва паёмҳои шахсӣ.', 'Reviews, ratings, a shared chat and direct messages.'],
  'Главная особенность': ['Хусусияти асосӣ', 'Key feature'], 'Проверка оригинальности перед публикацией': ['Санҷиши асолат пеш аз нашр', 'Originality check before publishing'],
  'Чужой текст не получится выдать за свой, даже если поменять название или имя автора. Сайт сравнивает каждую фразу со всей библиотекой, ищет строки классиков, проверяет название и просит ИИ оценить текст.': ['Матни бегонаро ҳамчун матни худ нишон додан мумкин нест, ҳатто агар ном ё муаллифро иваз кунед. Сайт ҳар ибораро бо тамоми китобхона муқоиса мекунад, сатрҳои классиконро меҷӯяд, номро месанҷад ва аз зеҳни сунъӣ баҳо мепурсад.', 'You can’t pass someone else’s text off as your own, even with a new title or author name. The site compares every phrase with the whole library, looks for lines of the classics, checks the title and asks AI to assess the text.'],
  'Одинаковых фраз нет': ['Ибораҳои якхела нест', 'No identical phrases'], 'ИИ: похоже на оригинальный текст': ['ЗС: ба матни асил монанд аст', 'AI: looks like an original text'],
  'Можно публиковать. У работы появится значок «✓ Проверено».': ['Нашр кардан мумкин аст. Асар нишони «✓ Санҷида шуд» мегирад.', 'Ready to publish. The work gets a “✓ Checked” badge.'],
  'ИИ-помощник': ['Ёрдамчии ЗС', 'AI assistant'], 'Выделите строку — ИИ объяснит': ['Сатрро ҷудо кунед — ЗС шарҳ медиҳад', 'Select a line — AI explains it'],
  'Помощник отвечает только по тексту книги и указывает страницу. Он коротко пересказывает книгу, собирает таблицу и выделяет главные строки прямо в тексте.': ['Ёрдамчӣ танҳо аз рӯи матни китоб ҷавоб медиҳад ва саҳифаро нишон медиҳад. Ӯ китобро мухтасар нақл мекунад, ҷадвал месозад ва сатрҳои асосиро дар худи матн ҷудо мекунад.', 'The assistant answers only from the book’s text and cites the page. It summarises the book, builds a table and highlights key lines right in the text.'],
  'Объясни этот отрывок простыми словами.': ['Ин порчаро бо забони содда шарҳ деҳ.', 'Explain this passage in simple words.'],
  'Садовник говорит: мы пользуемся тем, что сделали для нас предки, и теперь должны сами сделать что-то для потомков.': ['Боғбон мегӯяд: мо аз он чи ниёгон барои мо карданд, баҳра мебарем ва акнун худамон бояд барои наслҳои оянда коре кунем.', 'The gardener says: we enjoy what our ancestors did for us, and now we must do something for those who come after us.'],
  'Авторы': ['Муаллифон', 'Authors'], 'Профиль как в Instagram': ['Профил мисли Instagram', 'An Instagram-style profile'],
  'У каждого преподавателя своя страница: фото, должность, кафедра, счётчики и все работы — книги, эссе и стихи. Студенты оставляют отзывы и пишут автору в личные сообщения.': ['Ҳар омӯзгор саҳифаи худро дорад: акс, вазифа, кафедра, ҳисобкунакҳо ва ҳамаи корҳо — китоб, эссе ва шеър. Донишҷӯён тақриз мегузоранд ва ба муаллиф паёми шахсӣ менависанд.', 'Every teacher has a page: photo, position, department, counters and all their work — books, essays and poems. Students leave reviews and message the author directly.'],
  'Муаллиф': ['Муаллиф', 'Author'], 'Доцент · кафедра литературы': ['Дотсент · кафедраи адабиёт', 'Associate professor · literature department'], 'Пример оформления профиля.': ['Намунаи профил.', 'Sample profile.'],
  'Библиотека, в которой хочется читать': ['Китобхонае, ки дар он хондан мехоҳед', 'A library you want to read in'],
  'Живая комната на фоне меняется вместе с вами: 4 темы, 4 времени года, день и ночь, дождь, снег и гроза. Весной и летом камин потушен. Есть режим чтения и 10 спокойных звуков.': ['Ҳуҷраи зинда дар замина бо шумо тағйир меёбад: 4 мавзӯъ, 4 фасл, рӯз ва шаб, борон, барф ва раъду барқ. Баҳор ва тобистон оташдон хомӯш аст. Реҷаи хондан ва 10 садои ором ҳаст.', 'The living room in the background changes with you: 4 themes, 4 seasons, day and night, rain, snow and storms. In spring and summer the fire is out. There is a reading mode and 10 calming sounds.'],
  'Нажмите на окно — комната на фоне сменит время года.': ['Тирезаро пахш кунед — ҳуҷра фасли солро иваз мекунад.', 'Click a window and the room changes its season.'],
  'Для всех': ['Барои ҳама', 'For everyone'], 'Три языка и любой экран': ['Се забон ва ҳар экран', 'Three languages, any screen'],
  'Интерфейс переключается одной кнопкой. Сайт удобно открывать и на компьютере, и на телефоне.': ['Интерфейс бо як тугма иваз мешавад. Сайтро ҳам дар компютер ва ҳам дар телефон кушодан қулай аст.', 'The interface switches with one button. The site works on both computers and phones.'],
  'Как это устроено': ['Ин чӣ тавр кор мекунад', 'How it works'], 'Под капотом': ['Дар дохил', 'Under the hood'], 'Фрагменты по страницам': ['Порчаҳо аз рӯи саҳифа', 'Fragments by page'],
  'Claude (ИИ)': ['Claude (ЗС)', 'Claude (AI)'], 'Ответ со ссылкой на страницу': ['Ҷавоб бо ишора ба саҳифа', 'An answer citing the page'], 'Защита': ['Ҳифз', 'Security'], 'Технологии': ['Технологияҳо', 'Technology'],
  'Пароли хранятся зашифрованными (PBKDF2)': ['Паролҳо рамзгузошта нигоҳ дошта мешаванд (PBKDF2)', 'Passwords are stored encrypted (PBKDF2)'], 'Блокировка после 5 неудачных попыток входа': ['Пас аз 5 кӯшиши ноком воридшавӣ баста мешавад', 'Lockout after 5 failed sign-in attempts'],
  'Защита от спама в чате и комментариях': ['Ҳифз аз спам дар чат ва шарҳҳо', 'Spam protection in chat and comments'],
  'Защита от XSS: любой текст пользователей экранируется': ['Ҳифз аз XSS: ҳар матни корбарон безарар карда мешавад', 'XSS protection: all user text is escaped'],
  'Вход через Google (Firebase Authentication)': ['Воридшавӣ бо Google (Firebase Authentication)', 'Sign-in with Google (Firebase Authentication)'],
  'Войти через Google': ['Ворид шудан бо Google', 'Sign in with Google'], 'Юзернейм': ['Номи корбар', 'Username'],
  'Латинские буквы, цифры, «_» и «.» — по нему вас найдут друзья.': ['Ҳарфҳои лотинӣ, рақамҳо, «_» ва «.» — дӯстон шуморо бо он меёбанд.', 'Latin letters, digits, “_” and “.” — friends will find you by it.'],
  'По юзернейму вас находят друзья. Латинские буквы, цифры, «_» и «.».': ['Дӯстон шуморо бо номи корбар меёбанд. Ҳарфҳои лотинӣ, рақамҳо, «_» ва «.».', 'Friends find you by your username. Latin letters, digits, “_” and “.”.'],
  'Придумайте юзернейм.': ['Номи корбарро интихоб кунед.', 'Choose a username.'], 'Юзернейм: от 3 до 20 знаков.': ['Номи корбар: аз 3 то 20 аломат.', 'Username: 3 to 20 characters.'],
  'Юзернейм: только латинские буквы, цифры, «_» и «.» (не в начале и не в конце).': ['Номи корбар: танҳо ҳарфҳои лотинӣ, рақамҳо, «_» ва «.» (на дар аввал ва на дар охир).', 'Username: only Latin letters, digits, “_” and “.” (not at the start or end).'],
  'Этот юзернейм занят.': ['Ин номи корбар банд аст.', 'This username is taken.'], 'Проверяем…': ['Санҷида истодаем…', 'Checking…'],
  '✓ Свободен': ['✓ Озод', '✓ Available'], '✕ Уже занят': ['✕ Аллакай банд', '✕ Already taken'], '✓ Это ваш юзернейм': ['✓ Ин номи корбари шумост', '✓ This is your username'],
  'Найти по юзернейму': ['Ҷустуҷӯ бо номи корбар', 'Find by username'], '@юзернейм': ['@номи_корбар', '@username'], '@юзернейм или имя…': ['@номи корбар ё ном…', '@username or name…'],
  'Введите юзернейм друга, например @madina — он есть в профиле у каждого.': ['Номи корбари дӯстро ворид кунед, масалан @madina — он дар профили ҳар кас ҳаст.', 'Enter a friend’s username, e.g. @madina — everyone has it in their profile.'],
  'Ищем…': ['Ҷустуҷӯ…', 'Searching…'], 'Никого не нашли.': ['Касе ёфт нашуд.', 'Nobody found.'],
  'Чтобы написать новому человеку, найдите его по юзернейму во вкладке «Друзья».': ['Барои навиштан ба одами нав, ӯро бо номи корбар дар бахши «Дӯстон» ёбед.', 'To message someone new, find them by username in the “Friends” tab.'],
  'Общая база Firestore не подключена — друзья и чаты пока работают только на этом устройстве.': ['Пойгоҳи умумии Firestore пайваст нест — дӯстон ва чатҳо ҳоло танҳо дар ҳамин дастгоҳ кор мекунанд.', 'The shared Firestore database is not connected — friends and chats work only on this device for now.'],
  'Нет доступа. Обновите страницу и попробуйте снова.': ['Дастрасӣ нест. Саҳифаро нав кунед ва боз кӯшиш кунед.', 'Access denied. Reload the page and try again.'],
  'Не получилось. Проверьте интернет и попробуйте снова.': ['Нашуд. Интернетро санҷед ва боз кӯшиш кунед.', 'That did not work. Check your internet and try again.'],
  'Нет связи с общей базой. Попробуйте чуть позже.': ['Бо пойгоҳи умумӣ пайваст нест. Каме баъд кӯшиш кунед.', 'No connection to the shared database. Try again a little later.'],
  'Этот участник есть только на этом устройстве.': ['Ин корбар танҳо дар ҳамин дастгоҳ аст.', 'This member exists only on this device.'],
  'Не удалось сохранить юзернейм.': ['Номи корбарро нигоҳ доштан нашуд.', 'Could not save the username.'], 'Продолжить с Google': ['Идома бо Google', 'Continue with Google'],
  'Аккаунт': ['Ҳисоб', 'Account'], 'Вход и регистрация': ['Воридшавӣ ва бақайдгирӣ', 'Sign in and sign up'], 'Аккаунт: вход и регистрация': ['Ҳисоб: воридшавӣ ва бақайдгирӣ', 'Account: sign in and sign up'],
  'Войдите или зарегистрируйтесь, чтобы публиковать, оценивать и общаться. Читать можно и без аккаунта.': ['Ворид шавед ё ба қайд гиред, то нашр кунед, баҳо диҳед ва муошират кунед. Хондан бе ҳисоб ҳам мумкин аст.', 'Sign in or sign up to publish, rate and chat. You can read without an account.'],
  'Чтобы продолжить, войдите или зарегистрируйтесь — это займёт минуту.': ['Барои идома ворид шавед ё ба қайд гиред — ин як дақиқа вақт мегирад.', 'To continue, sign in or sign up — it takes a minute.'],
  'или по почте': ['ё бо почта', 'or with email'], 'Запомнить меня': ['Маро дар хотир дор', 'Remember me'], 'Забыли пароль?': ['Паролро фаромӯш кардед?', 'Forgot password?'],
  'Нет аккаунта?': ['Ҳисоб надоред?', 'No account?'], 'Зарегистрироваться': ['Ба қайд гирифтан', 'Sign up'], 'Уже есть аккаунт?': ['Аллакай ҳисоб доред?', 'Already have an account?'],
  'Восстановление пароля': ['Барқарорсозии парол', 'Password recovery'], 'Введите почту — мы пришлём ссылку для нового пароля.': ['Почтаро ворид кунед — мо барои пароли нав пайванд мефиристем.', 'Enter your email and we will send a link to set a new password.'],
  'Отправить ссылку': ['Фиристодани пайванд', 'Send link'], '← Назад ко входу': ['← Бозгашт ба воридшавӣ', '← Back to sign in'], 'Показать пароль': ['Нишон додани парол', 'Show password'],
  'Входим…': ['Ворид мешавем…', 'Signing in…'], 'Создаём аккаунт…': ['Ҳисоб сохта мешавад…', 'Creating account…'], 'Отправляем…': ['Фиристода мешавад…', 'Sending…'],
  'Введите пароль.': ['Паролро ворид кунед.', 'Enter your password.'],
  'Если такой аккаунт есть, мы отправили на почту ссылку для нового пароля.': ['Агар чунин ҳисоб бошад, мо ба почта пайванд барои пароли нав фиристодем.', 'If such an account exists, we have emailed a link to set a new password.'],
  'Эта почта уже зарегистрирована — войдите в аккаунт.': ['Ин почта аллакай ба қайд гирифта шудааст — ба ҳисоб ворид шавед.', 'This email is already registered — please sign in.'],
  'Нет связи с сервером. Проверьте интернет.': ['Бо сервер пайваст нест. Интернетро санҷед.', 'Cannot reach the server. Check your internet connection.'],
  'Этот способ входа не включён в Firebase (Authentication → Sign-in method).': ['Ин тарзи воридшавӣ дар Firebase фаъол нест (Authentication → Sign-in method).', 'This sign-in method is not enabled in Firebase (Authentication → Sign-in method).'],
  'Пароль слишком простой.': ['Парол хеле сода аст.', 'The password is too weak.'], 'Этот аккаунт отключён.': ['Ин ҳисоб хомӯш карда шудааст.', 'This account is disabled.'],
  'Не получилось. Попробуйте ещё раз.': ['Нашуд. Боз кӯшиш кунед.', 'That did not work. Please try again.'],
  'Письмо для подтверждения почты отправлено.': ['Мактуб барои тасдиқи почта фиристода шуд.', 'A confirmation email has been sent.'],
  'В демо-версии пароль восстановить нельзя.': ['Дар версияи намоишӣ паролро барқарор кардан мумкин нест.', 'Password recovery is not available in the demo.'],
  'Вы вошли по почте': ['Шумо бо почта ворид шудед', 'You are signed in with email'],
  'Пароль хранится у Firebase (Google) в зашифрованном виде. Забыли или хотите сменить — пришлём ссылку на почту.': ['Парол дар Firebase (Google) рамзгузорӣ шуда нигоҳ дошта мешавад. Агар фаромӯш кардед ё иваз кардан хоҳед — пайвандро ба почта мефиристем.', 'Your password is stored encrypted by Firebase (Google). Forgot it or want to change it? We will email you a link.'],
  'Сменить пароль по ссылке': ['Иваз кардани парол бо пайванд', 'Change password via email link'],
  'Письмо для смены пароля отправлено на почту.': ['Мактуб барои иваз кардани парол ба почта фиристода шуд.', 'A password change email has been sent.'],
  'Войдите, чтобы публиковать свои книги, эссе и стихи, писать отзывы и общаться.': ['Ворид шавед, то китобҳо, эссеҳо ва шеърҳои худро нашр кунед, тақриз нависед ва муошират кунед.', 'Sign in to publish your books, essays and poems, write reviews and chat.'],
  'Google передаст сайту только имя, почту и фото. Пароль остаётся у Google.': ['Google ба сайт танҳо ном, почта ва аксро медиҳад. Парол дар Google мемонад.', 'Google shares only your name, email and photo. Your password stays with Google.'],
  'или демо-вход': ['ё вуруди намоишӣ', 'or demo sign-in'], 'Войти по почте': ['Ворид шудан бо почта', 'Sign in with email'],
  'или по почте и паролю': ['ё бо почта ва парол', 'or with email and password'], 'или создайте аккаунт с паролем': ['ё ҳисобро бо парол созед', 'or create an account with a password'],
  'Вы вошли через Google': ['Шумо бо Google ворид шудед', 'You are signed in with Google'],
  'Пароль здесь не нужен: вход защищает ваш аккаунт Google (двухэтапная проверка, оповещения о входе).': ['Дар ин ҷо парол лозим нест: воридшавиро ҳисоби Google-и шумо ҳифз мекунад (санҷиши дуқадама, огоҳӣ дар бораи воридшавӣ).', 'No password needed here: your Google account protects sign-in (2-step verification, sign-in alerts).'],
  'Вход через Google заработает, когда будут подключены ключи Firebase.': ['Воридшавӣ бо Google пас аз пайваст шудани калидҳои Firebase кор мекунад.', 'Google sign-in will work once the Firebase keys are connected.'],
  'Вход через Google работает на опубликованном сайте, а не в предпросмотре.': ['Воридшавӣ бо Google дар сайти нашршуда кор мекунад, на дар пешнамоиш.', 'Google sign-in works on the published site, not in the preview.'],
  'Подключаемся к Google… Нажмите ещё раз через секунду.': ['Ба Google пайваст мешавем… Пас аз як сония боз пахш кунед.', 'Connecting to Google… Tap again in a second.'],
  'Этот адрес сайта не добавлен в Firebase (Authentication → Settings → Authorized domains).': ['Ин суроғаи сайт ба Firebase илова нашудааст (Authentication → Settings → Authorized domains).', 'This site address is not added in Firebase (Authentication → Settings → Authorized domains).'],
  'Нет связи с Google. Проверьте интернет.': ['Бо Google пайваст нест. Интернетро санҷед.', 'Cannot reach Google. Check your internet connection.'],
  'Вход через Google не включён в Firebase (Authentication → Sign-in method).': ['Воридшавӣ бо Google дар Firebase фаъол нест (Authentication → Sign-in method).', 'Google sign-in is not enabled in Firebase (Authentication → Sign-in method).'],
  'Неверные ключи Firebase. Проверьте apiKey.': ['Калидҳои Firebase нодурустанд. apiKey-ро санҷед.', 'Invalid Firebase keys. Check the apiKey.'],
  'Слишком много попыток. Подождите немного.': ['Кӯшишҳо хеле зиёданд. Каме интизор шавед.', 'Too many attempts. Please wait a little.'],
  'Не удалось войти через Google. Попробуйте ещё раз.': ['Бо Google ворид шудан нашуд. Боз кӯшиш кунед.', 'Could not sign in with Google. Please try again.'],
  'Демо-аккаунты отключены. Войдите через Google.': ['Ҳисобҳои намоишӣ хомӯшанд. Бо Google ворид шавед.', 'Demo accounts are turned off. Sign in with Google.'],
  'Войдите, чтобы продолжить.': ['Барои идома ворид шавед.', 'Sign in to continue.'], 'Войдите': ['Ворид шавед', 'Sign in'],
  ', чтобы оценить и комментировать.': [', то баҳо диҳед ва шарҳ нависед.', ' to rate and comment.'],
  'Проверка целостности внешних скриптов (SRI)': ['Санҷиши бутунии скриптҳои берунӣ (SRI)', 'Integrity checks for external scripts (SRI)'],
  'ИИ не выполняет команды, спрятанные в тексте': ['ЗС фармонҳои пинҳоншударо дар матн иҷро намекунад', 'The AI ignores commands hidden in the text'],
  'Что-то пошло не так': ['Чизе нодуруст шуд', 'Something went wrong'],
  'Эту страницу не удалось показать. Ваши данные на месте — попробуйте вернуться на главную.': ['Ин саҳифаро нишон додан нашуд. Маълумоти шумо дар ҷояш аст — ба саҳифаи асосӣ баргардед.', 'This page could not be shown. Your data is safe — try going back to the home page.'],
  'Пароль слишком длинный (максимум 128 символов).': ['Парол хеле дароз аст (ҳадди аксар 128 аломат).', 'The password is too long (128 characters max).'],
  'Текст слишком большой (больше 2 млн символов). Разделите его на части.': ['Матн хеле калон аст (зиёда аз 2 млн аломат). Онро ба қисмҳо тақсим кунед.', 'The text is too large (over 2 million characters). Split it into parts.'],
  'Таблица слишком большая (максимум 50 МБ). Разделите её на части.': ['Ҷадвал хеле калон аст (ҳадди аксар 50 МБ). Онро ба қисмҳо тақсим кунед.', 'The table is too large (50 MB max). Split it into parts.'],
  'За один раз можно добавить до 20 000 книг — лишние строки пропущены.': ['Дар як бор то 20 000 китоб илова кардан мумкин аст — сатрҳои зиёдатӣ гузаронида шуданд.', 'Up to 20,000 books can be added at once — extra rows were skipped.'], 'Ссылки только на проверенные библиотеки': ['Пайвандҳо танҳо ба китобхонаҳои боэътимод', 'Links only to trusted libraries'],
  'План развития': ['Нақшаи рушд', 'Roadmap'], 'Общий сервер': ['Сервери умумӣ', 'A shared server'], 'Одна база для всего университета: книги, профили и чат на всех устройствах.': ['Як пойгоҳ барои тамоми донишгоҳ: китобҳо, профилҳо ва чат дар ҳамаи дастгоҳҳо.', 'One database for the whole university: books, profiles and chat on every device.'],

const LANG_IDX = { tg: 0, en: 1 };
function trCore(k, li) {
  const d = I18N[k];

    let changed = false;
    const parts = k.split(' · ').map(p => { const r = trCore(p, li); if (r != null) { changed = true; return r; } return p; });
    return changed ? parts.join(' · ') : null;
  }

}

}

  const wait = lockInfo(email);
  if (wait) return authMsg(`Слишком много попыток. Попробуйте через ${wait} сек.`);
  const done = authBusy(form, 'Входим…');
  const wrong = () => { const left = 5 - noteFail(email); authMsg(left > 0 ? `Неверная почта или пароль. Осталось попыток: ${left}.` : `Слишком много попыток. Попробуйте через ${lockInfo(email)} сек.`); };

        const lu = db.users.find(x => x.email === email && !x.fbUid && !isDemoUser(x) && (x.pw || x.password_hash));

        }

// данные из базы пишут другие люди — принимаем их только в проверенном виде
function applyProfile(u, d) {
  if (!isRec(d)) return;
  const s = (v, n) => typeof v === 'string' ? cleanText(v).slice(0, n).trim() : '';
  if (s(d.name, 80)) u.name = s(d.name, 80);
  if (typeof d.username === 'string' && USERNAME_RE.test(d.username)) u.username = d.username;
  u.role = pickRole(d.role, u.role || 'student');
  u.position = s(d.position, 80); u.faculty = s(d.faculty, 120); u.university = s(d.university, 120); u.bio = s(d.bio, 1000);
  if (typeof d.avatar === 'string' && SAFE_IMG.test(d.avatar)) u.avatar = d.avatar; else delete u.avatar;
  if (typeof d.photo === 'string' && GPHOTO.test(d.photo)) u.photo = d.photo; else delete u.photo;
  if (Number.isInteger(d.banner) && d.banner >= 0) u.banner = d.banner % PALS.length; else delete u.banner;
}
function profileOut(u) {
  const s = (k, n) => String(u[k] || '').slice(0, n);
  return { name: s('name', 80) || 'Читатель', username: u.username, role: pickRole(u.role, 'student'), position: s('position', 80), faculty: s('faculty', 120),
    university: s('university', 120), bio: s('bio', 1000), avatar: u.avatar && SAFE_IMG.test(u.avatar) && u.avatar.length <= 200000 ? u.avatar : '',

}
// местная запись для человека из общей базы (по его uid)
function localOf(uid) {

  if (!u) { u = { id: nextId('users'), fbUid: uid, name: '…', role: 'student', remote: true, created_at: nowStr() }; db.users.push(u); }
  if (!cloud.asked.has(uid)) { cloud.asked.add(uid); cloud.queue.add(uid); clearTimeout(cloud.qt); cloud.qt = setTimeout(fetchProfiles, 60); }

}
async function fetchProfiles() {
  const ids = [...cloud.queue].filter(x => x !== cloud.uid); cloud.queue.clear();
  const api = cloud.api;
  for (let i = 0; i < ids.length; i += 30) {
    try {
      const s = await api.getDocs(api.query(api.collection(cloud.fs, 'users'), api.where(api.documentId(), 'in', ids.slice(i, i + 30))));
      s.forEach(d => { const u = db.users.find(x => x.fbUid === d.id); if (u) applyProfile(u, d.data()); });
    } catch (e) { console.warn(e); }
  }
  save(); cloudRefresh();
}
async function cloudClaim(u, n) {
  const api = cloud.api, F = cloud.fs, b = api.writeBatch(F), old = cloud.claimed;
  b.set(api.doc(F, 'usernames', n), { uid: u.fbUid });
  b.set(api.doc(F, 'users', u.fbUid), profileOut({ ...u, username: n }));
  if (old && old !== n) b.delete(api.doc(F, 'usernames', old));
  await b.commit();
  u.username = n; cloud.claimed = n; save();
}
// первый вход: профиль появляется в общей базе, юзернейм занимается (если занят — подбираем свободный)
async function publishProfile(u, wanted) {
  const tries = [...new Set([wanted, u.username, u.email && suggestUsername(u.email.split('@')[0]), suggestUsername(u.name)].map(cleanUsername).filter(n => n && !usernameProblem(n)))];
  const base = tries[0] || 'reader';
  for (let i = 0; i < 8; i++) {
    const n = i < tries.length ? tries[i] : base.slice(0, 15) + Math.floor(1000 + Math.random() * 9000);
    try {
      await cloudClaim(u, n);
      if (wanted && n !== wanted) toast(`Юзернейм @${wanted} занят — вам выдан @${n}. Изменить можно в профиле.`);
      return;
    } catch (e) { if (e && e.code !== 'permission-denied') throw e; }
  }
  throw new Error('username');
}
async function usernameFree(n, exceptId) {
  if (localUsernameTaken(n, exceptId)) return false;
  if (!FB_AUTH) return true;
  try { const api = await loadFs(), s = await api.getDoc(api.doc(cloud.fs, 'usernames', n)); return !s.exists() || (me() && s.data().uid === me().fbUid); }
  catch (e) { return true; }                                   // база недоступна — окончательно проверится при сохранении
}
async function cloudStart(u) {
  if (!FB_AUTH || !u || !u.fbUid || ((cloud.ok || cloud.starting) && cloud.uid === u.fbUid)) return;
  cloudStop();
  cloud.uid = u.fbUid; cloud.starting = true;
  try {
    const api = await loadFs(), F = cloud.fs;
    const snap = await api.getDoc(api.doc(F, 'users', u.fbUid));
    if (cloud.uid !== u.fbUid) return;
    const data = snap.exists() ? snap.data() : null;
    if (data && data.username) { applyProfile(u, data); cloud.claimed = data.username; }
    else await publishProfile(u, u.username);
    cloud.ok = true; cloud.reqSeen = null;
    cloud.subs.push(api.onSnapshot(api.query(api.collection(F, 'friends'), api.where('users', 'array-contains', u.fbUid)), onFriendsSnap, e => console.warn(e)));
    cloud.subs.push(api.onSnapshot(api.query(api.collection(F, 'chats'), api.where('members', 'array-contains', u.fbUid)), onChatsSnap, e => console.warn(e)));
    save(); cloudRefresh();
  } catch (e) { cloudErr(e); }

}
function cloudStop(purge) {
  cloud.subs.forEach(f => f()); cloud.subs = [];
  cloud.msgSubs.forEach(f => f()); cloud.msgSubs.clear();
  cloud.ensuring.clear(); cloud.ok = false; cloud.uid = null; cloud.claimed = null;
  peopleQuery = ''; peopleFound = { q: '', ids: [], busy: false };
  if (purge && db) {                                    // чужие переписки не остаются на устройстве после выхода
    const ids = new Set(db.chats.filter(c => c.cloudId).map(c => c.id));
    db.chats = db.chats.filter(c => !c.cloudId); db.messages = db.messages.filter(m => !ids.has(m.chat)); db.friends = db.friends.filter(f => !f.cloud);
    save();

}
// изменения из базы приходят сами; страницу перерисовываем, только если человек сейчас ничего не набирает
function cloudRefresh() {
  clearTimeout(cloud.rt);
  cloud.rt = setTimeout(() => {
    if (route.name !== 'chat' && route.name !== 'profile') return renderNav();
    const a = document.activeElement;
    const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !['chatInput', 'peopleFind', 'chatSearch'].includes(a.id);
    if (route.params.modal || typing || !document.getElementById('authModal').hidden) { renderNav(); cloud.rt = setTimeout(cloudRefresh, 1500); return; }
    render({ soft: true });

function onFriendsSnap(snap) {
  const list = [], mine = me() && me().id;
  snap.forEach(d => {
    const x = d.data();
    if (!Array.isArray(x.users) || x.users.length !== 2 || !x.users.includes(cloud.uid) || typeof x.from !== 'string') return;
    list.push({ a: localOf(x.users[0]), b: localOf(x.users[1]), from: localOf(x.from), status: x.status === 'accepted' ? 'accepted' : 'pending', at: +x.at || 0, cloud: d.id });
  });
  const incoming = list.filter(f => f.status === 'pending' && f.from !== mine);
  if (cloud.reqSeen) incoming.filter(f => !cloud.reqSeen.has(f.cloud)).forEach(f => toast(`Новая заявка в друзья: ${(userById(f.from) || {}).name || ''}`));
  cloud.reqSeen = new Set(incoming.map(f => f.cloud));
  db.friends = db.friends.filter(f => !f.cloud).concat(list);
  save(); cloudRefresh();
}
function localChat(cid) {
  let c = db.chats.find(x => x.cloudId === cid);
  if (!c) { c = { id: nextId('chats'), cloudId: cid, type: 'direct', members: [], createdAt: Date.now() }; db.chats.push(c); }
  return c;
}
function onChatsSnap(snap) {
  const seen = new Set();
  snap.forEach(d => {
    const x = d.data();
    if (!Array.isArray(x.members) || !x.members.includes(cloud.uid)) return;
    seen.add(d.id);
    const c = localChat(d.id);
    c.type = x.type === 'group' ? 'group' : 'direct';
    c.members = [...new Set(x.members.filter(m => typeof m === 'string').slice(0, 100))].map(localOf);
    if (c.type === 'group') {
      c.name = (typeof x.name === 'string' && cleanText(x.name).trim().slice(0, 60)) || 'Группа';
      c.emoji = typeof x.emoji === 'string' && GROUP_EMOJI.includes(x.emoji) ? x.emoji : '👥';
      c.color = Number.isInteger(x.color) ? Math.abs(x.color) % PALS.length : 0;
    }
    c.owner = typeof x.owner === 'string' ? localOf(x.owner) : null;
    c.createdAt = +x.createdAt || c.createdAt;
    delete c.pending;
    if (!cloud.msgSubs.has(d.id)) listenMsgs(d.id);

  db.chats.filter(c => c.cloudId && !c.pending && !seen.has(c.cloudId)).forEach(c => {
    const f = cloud.msgSubs.get(c.cloudId); if (f) { f(); cloud.msgSubs.delete(c.cloudId); }
    db.chats = db.chats.filter(x => x !== c); db.messages = db.messages.filter(m => m.chat !== c.id);
  });

}
function listenMsgs(cid) {
  const api = cloud.api;
  let first = true;
  const q = api.query(api.collection(cloud.fs, 'chats', cid, 'messages'), api.orderBy('at', 'desc'), api.limit(200));
  cloud.msgSubs.set(cid, api.onSnapshot(q, s => {
    const c = db.chats.find(x => x.cloudId === cid); if (!c) return;
    const old = new Map(db.messages.filter(m => m.chat === c.id && m.cloudId).map(m => [m.cloudId, m])), list = [];
    s.forEach(d => {
      const x = d.data();
      if (typeof x.from !== 'string' || typeof x.text !== 'string') return;
      const prev = old.get(d.id);
      list.push({ id: prev ? prev.id : nextId('messages'), cloudId: d.id, chat: c.id, from: localOf(x.from), text: cleanText(x.text).slice(0, 2000), at: +x.at || 0,
        readBy: Array.isArray(x.readBy) ? x.readBy.filter(r => typeof r === 'string').map(localOf) : [], ...(x.system ? { system: true } : {}) });
    });
    const mine = me() && me().id, open = route.name === 'chat' && route.params.c === c.id;
    if (!first && !open) list.filter(m => !old.has(m.cloudId) && !m.system && m.from !== mine).slice(0, 1)
      .forEach(m => toast(`Новое сообщение от ${(userById(m.from) || {}).name || ''}`));
    first = false;
    db.messages = db.messages.filter(m => m.chat !== c.id).concat(list);

}
// ---- запись в общую базу
const pairKey = (a, b) => [a, b].sort().join('_');
function cloudFriend(kind, other) {
  const api = cloud.api, o = userById(other), u = me();
  if (!o || !o.fbUid) return toast('Этот участник есть только на этом устройстве.');
  const ref = api.doc(cloud.fs, 'friends', pairKey(cloud.uid, o.fbUid)), f = friendOf(u.id, other), fail = e => cloudErr(e, true);
  if (kind === 'add' && !f) { api.setDoc(ref, { users: [cloud.uid, o.fbUid].sort(), from: cloud.uid, status: 'pending', at: Date.now() }).catch(fail); toast(`Заявка отправлена: ${o.name}`); }
  else if ((kind === 'add' || kind === 'accept') && f && f.status === 'pending' && f.from !== u.id) { api.updateDoc(ref, { status: 'accepted', at: Date.now() }).catch(fail); toast(`Теперь вы друзья: ${o.name}`); }

}
function cloudDirect(o) {
  const ids = [cloud.uid, o.fbUid].sort(), cid = 'd_' + ids.join('_');
  let c = db.chats.find(x => x.cloudId === cid);
  if (!c) { c = localChat(cid); Object.assign(c, { type: 'direct', members: [me().id, o.id], pending: true, createdAt: Date.now() }); }

function cloudMarkRead(c) {

  const todo = db.messages.filter(m => m.chat === c.id && m.cloudId && !m.system && m.from !== mine && !(m.readBy || []).includes(mine) && !cloud.reading.has(m.cloudId)).slice(0, 400);

// поиск людей по юзернейму (по началу: «mad» найдёт @madina)
let peopleQuery = '', peopleFound = { q: '', ids: [], busy: false };
function cloudFind(value) {
  peopleQuery = value;
  const n = cleanUsername(value).replace(/[^a-z0-9_.]/g, '');
  clearTimeout(cloud.ft);
  if (n.length < 2) { peopleFound = { q: n, ids: [], busy: false }; return paintFound(); }
  peopleFound = { q: n, ids: peopleFound.q === n ? peopleFound.ids : [], busy: true }; paintFound();
  cloud.ft = setTimeout(async () => {
    try {
      const api = cloud.api, s = await api.getDocs(api.query(api.collection(cloud.fs, 'users'), api.where('username', '>=', n), api.where('username', '<=', n + ''), api.limit(12)));

// поле «Юзернейм»: подсказка и проверка, свободен ли
function checkUsernameField(inp, exceptId) {
  const hint = document.getElementById(inp.dataset.hint), n = cleanUsername(inp.value);
  if (!hint) return;
  const set = (txt, cls) => { hint.textContent = txt; hint.className = 'un-hint ' + cls; if (settings.lang !== 'ru') translateTree(hint); };
  const p = usernameProblem(n);
  if (p) return set(p, 'err');
  if (me() && me().username === n && (!FB_AUTH || cloud.claimed === n || !cloudOn())) return set('✓ Это ваш юзернейм', 'ok');
  set('Проверяем…', '');
  clearTimeout(inp._t);
  inp._t = setTimeout(async () => {
    const free = await usernameFree(n, exceptId);
    if (cleanUsername(inp.value) === n) set(free ? '✓ Свободен' : '✕ Уже занят', free ? 'ok' : 'err');

  chat(params) {

        if (cloudOn() && other.fbUid) params.c = cloudDirect(other).id;          // общий чат в базе
        else { const dc = directChat(u.id, other.id, true); params.c = dc.id; }
        save();
      }
      delete params.with;
    }
    const tab = params.tab || 'all';
    const all = myChats(u.id).filter(c => c.type === 'group' || lastMsg(c.id) || c.id === params.c)
      .sort((a, b) => ((lastMsg(b.id) || {}).at || b.createdAt) - ((lastMsg(a.id) || {}).at || a.createdAt));
    const listed = tab === 'direct' ? all.filter(c => c.type === 'direct') : tab === 'group' ? all.filter(c => c.type === 'group') : all;
    let cur = params.c ? chatById(params.c) : null;
    if (cur && !cur.members.includes(u.id)) cur = null;
    if (!cur && wide && tab !== 'friends' && !params.modal) cur = all[0] || null;
    if (cur) { params.c = cur.id; markRead(cur, u.id); }

function highlight(text, lines) {
  let html = esc(text);
  for (const l of lines) {
    const needle = esc(String(l || '').trim());
    // замена функцией: знаки $ в тексте не превращаются в шаблоны подстановки
    if (needle.length > 8 && html.includes(needle)) html = html.replace(needle, () => `<mark class="key">${needle}</mark>`);
  }
  return html;
}

const input = document.getElementById('searchInput');

let sugItems = [], sugActive = -1, sugTimer = 0;
function suggestions(q) {
  const items = [];
  if (!q.trim()) {
    items.push({ label: 'Популярное' });
    ['shahnameh', 'khayyam', 'rudaki-mulien', 'gulistan', 'masnavi'].forEach(id => { const c = CATALOG.find(x => x.id === id); items.push({ kind: 'classic', c }); });
    return items;
  }
  const r = searchAll(q);
  if (r.authors.length) { items.push({ label: 'Авторы' }); r.authors.slice(0, 2).forEach(a => items.push({ kind: 'author', a })); }
  if (r.classics.length) { items.push({ label: 'Классика' }); r.classics.slice(0, 5).forEach(c => items.push({ kind: 'classic', c })); }
  if (r.works.length) { items.push({ label: 'Наши авторы' }); r.works.slice(0, 3).forEach(b => items.push({ kind: 'work', b })); }
  if (r.people.length) { r.people.slice(0, 2).forEach(p => items.push({ kind: 'person', p })); }
  if (!r.works.length) {
    items.push({ label: 'Нет в Китобхоне — ближайший безопасный сайт' });
    items.push({ kind: 'site', s: (r.classics[0] && r.classics[0].ext ? entrySites(r.classics[0]) : pickSites(q))[0] });
  }
  items.push({ kind: 'all', q });
  return items;
}
function sugRow(it, i) {
  const [c1, c2] = it.c ? PALS[it.c.pal % PALS.length] : it.b ? PALS[hash(it.b.title) % PALS.length] : PALS[0];
  const inner = {
    classic: () => `<span class="mini" style="--c1:${c1};--c2:${c2}"></span><span class="txt"><b>${esc(it.c.t)}</b><span>${esc(it.c.a)} · ${esc(it.c.g)} · ${esc(it.c.y)}</span></span>`,
    work: () => `<span class="mini" style="--c1:${c1};--c2:${c2}"></span><span class="txt"><b>${esc(it.b.title)}</b><span>${esc(it.b.author)} · ${KIND[it.b.kind]}</span></span>`,
    author: () => `<span class="who">${esc(it.a.name.slice(0, 1))}</span><span class="txt"><b>${esc(it.a.name)}</b><span>Автор · ${it.a.n} в каталоге</span></span>`,
    person: () => `<span class="who">${esc(it.p.name.slice(0, 1))}</span><span class="txt"><b>${esc(it.p.name)}</b><span>Автор Китобхоны · ${it.p.n_books} произв.</span></span>`,
    all: () => `<span class="txt"><b>Искать «${esc(it.q)}» везде →</b></span>`,
    site: () => `<span class="who">🔒</span><span class="txt"><b>Открыть на сайте ${esc(it.s.name)} ↗</b><span>${esc(it.s.host)} · ${esc(it.s.why)}</span></span>`
  }[it.kind]();
  if (it.kind === 'site') return `<a class="sg site" role="option" id="sg${i}" data-sg="${i}" href="${esc(it.s.href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
  return `<div class="sg${it.kind === 'all' ? ' all' : ''}" role="option" id="sg${i}" data-sg="${i}">${inner}</div>`;
}
function openSuggest() {
  const q = input.value;
  sugItems = suggestions(q); sugActive = -1;
  let n = 0;
  sugBox.innerHTML = sugItems.map(it => it.label ? `<div class="sg-label">${esc(it.label)}</div>` : sugRow(it, n++)).join('');
  sugItems = sugItems.filter(it => !it.label);

  requestAnimationFrame(() => sugBox.classList.add('open'));
}
function closeSuggest() {
  if (sugBox.hidden) return;
  sugBox.classList.remove('open'); input.setAttribute('aria-expanded', 'false');
  setTimeout(() => { if (!sugBox.classList.contains('open')) sugBox.hidden = true; }, reduceMotion ? 0 : 180);
}
function pickSuggest(i) {
  const it = sugItems[i]; if (!it) return;
  if (it.kind === 'site') { document.getElementById('sg' + i).click(); return; }
  closeSuggest(); input.blur();
  if (it.kind === 'classic') go('classic', { cid: it.c.id });
  else if (it.kind === 'work') go('book', { id: it.b.id });
  else if (it.kind === 'author') go('search', { q: it.a.name });

}
function setActive(i) {
  sugActive = (i + sugItems.length) % sugItems.length;
  sugBox.querySelectorAll('.sg').forEach(el => el.classList.toggle('active', +el.dataset.sg === sugActive));
  const el = document.getElementById('sg' + sugActive);
  if (el) { el.scrollIntoView({ block: 'nearest' }); input.setAttribute('aria-activedescendant', el.id); }
}
input.addEventListener('focus', openSuggest);
input.addEventListener('input', () => { clearTimeout(sugTimer); sugTimer = setTimeout(openSuggest, 90); });
input.addEventListener('keydown', e => {

  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(sugActive - 1); }

sugBox.addEventListener('mousedown', e => e.preventDefault());

  pickSuggest(+el.dataset.sg);

input.addEventListener('blur', () => setTimeout(closeSuggest, 100));
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();

  const q = input.value.trim(); closeSuggest(); input.blur();

async function startBrief(key) {

  const [type, raw] = key.split(':');
  const c = type === 'c' ? CATALOG.find(x => x.id === raw) : null;
  const b = type === 'b' ? bookRow(db.books.find(x => x.id === +raw)) : null;
  btn.disabled = true;
  box.innerHTML = thinkingHTML(type === 'c' ? 'ИИ вспоминает книгу и собирает главное…' : 'ИИ читает текст и выделяет главное…');
  let result, note = '';
  try { result = await runBrief(c ? classicPrompt(c) : workPrompt(b)); }
  catch (e) {
    result = c ? classicFallback(c) : workFallback(b);
    note = c ? briefErrorNote(e) : briefErrorNote(e).replace('показана справка библиотеки', 'главные строки выбраны автоматически');
  }
  result.note = note;

function loadScript(src, integrity) {

const MAX_FILE = 500 * 1024 * 1024, MAX_BOOK_CHARS = 20000000;
async function extractPages(file, onProgress) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt') {
    const text = await file.text();
    return text.includes('\f') ? text.split('\f').filter(p => p.trim()) : paginate(text, 3000);
  }
  // рабочий скрипт подключается как обычный, поэтому PDF разбирается прямо на странице
  if (!window.pdfjsLib) await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, enableXfa: false }).promise;
  const pages = [];
  try {
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i), tc = await page.getTextContent();
      pages.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join(''));
      page.cleanup();                                   // освобождаем память страницы: важно для больших файлов
      if (onProgress && (i % 5 === 0 || i === pdf.numPages)) { onProgress(i, pdf.numPages); await new Promise(r => setTimeout(r)); }
    }
  } finally { pdf.destroy(); }
  return pages;
}

async function runBulk() {

      c.globalAlpha = Math.max(0, (1 - k) * Math.min(1, k * 8) * 0.5);
      const s = p.r * (1 - k * 0.55);
      c.drawImage(sp, p.x - s * 0.4, p.y - s * 1.1, s * 0.8, s * 2.2);
    }
    c.globalAlpha = 1;
    for (const p of sparks) { c.fillStyle = `rgba(${TH.spark},${1 - p.life / p.max})`; c.fillRect(p.x, p.y, 2, 2); }
    for (let i = 0; i < 14; i++) {
      const x = 1192 + i * 11, y = 616 + Math.sin(i * 2.3) * 6;
      c.fillStyle = `rgba(${TH.ember},${0.3 + 0.3 * Math.sin(i + performance.now() / 300)})`; c.fillRect(x, y, 4, 2);
    }
    c.restore();
  }
  function drawCandle(c, x, t, i) {
    const fl = Math.sin(t * 9 + i * 3) * 0.8 + Math.sin(t * 23 + i) * 0.4;
    c.save(); c.globalCompositeOperation = 'lighter';
    c.fillStyle = rad(c, x, 186, 0, 46, [[0, `rgba(${TH.candle[1]},0.28)`], [1, `rgba(${TH.candle[1]},0)`]]); c.fillRect(x - 46, 140, 92, 92);
    c.translate(x + fl * 0.6, 188); c.scale(1, 2.1);
    c.fillStyle = rad(c, 0, 0, 0, 5, [[0, `rgba(${TH.candle[0]},1)`], [0.5, `rgba(${TH.candle[1]},0.8)`], [1, `rgba(${TH.candle[2]},0)`]]);
    c.beginPath(); c.arc(0, 0, 5, 0, 7); c.fill(); c.restore();
  }
  function drawClockHands(c) {
    const d = new Date(), cx = 1265, cy = 216;
    const hand = (a, len, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); c.stroke(); };
    c.strokeStyle = '#1e140c'; c.lineCap = 'round';
    hand((d.getHours() % 12 + d.getMinutes() / 60) * Math.PI / 6, 12, 2.4);
    hand((d.getMinutes() + d.getSeconds() / 60) * Math.PI / 30, 18, 1.6);
    c.strokeStyle = '#8a1c1c'; hand(d.getSeconds() * Math.PI / 30, 19, 0.8); c.lineCap = 'butt';
  }
  function drawSteam(c, t) {
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 6; c.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      c.beginPath();
      for (let y = 676; y > 600; y -= 4) {
        const x = 996 + i * 8 + Math.sin(y * 0.08 + t * 1.3 + i * 2) * 6 * (676 - y) / 70;
        y === 676 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.stroke();
    }
    c.lineCap = 'butt';
  }

  // ---------------------------------------------------------------- кадр
  let spread = 0, cycle = performance.now(), last = performance.now(), running = true, looping = false;
  let fade = null;
  function refade() {
    const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height; snap.getContext('2d').drawImage(cv, 0, 0);
    return snap;
  }
  window.kitobScene = {
    // сезон, время суток, погода и камин
    setEnv(env) {
      if (!env || ['season', 'time', 'weather', 'fire'].every(k => env[k] === ENV[k])) return;
      const snap = refade();
      ENV = env;
      if (!L) return;
      build();
      fade = reduce || !running ? null : { img: snap, t0: performance.now() };
      if (reduce || !running) frame(performance.now());
    },
    setRunning(on) { running = on; if (on && !looping && !reduce && L) { looping = true; last = performance.now(); requestAnimationFrame(frame); } },
    // смена темы: комната перекрашивается, старый кадр плавно растворяется поверх нового
    setTheme(name) {
      const t = THEMES[name] || THEMES.fireplace;
      if (t === TH) return;
      const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height; snap.getContext('2d').drawImage(cv, 0, 0);
      TH = t; buildSprites();
      if (!L) return;
      build();
      fade = reduce || !running ? null : { img: snap, t0: performance.now() };
      if (reduce || !running) frame(performance.now());
    }
  };
  const REST = 7, FLIP = 3.8;                       // 7 с на чтение разворота, 3,8 с на перелистывание
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.67); last = now;
    const t = now / 1000;
    const f = 0.82 + 0.1 * Math.sin(t * 7.3) + 0.06 * Math.sin(t * 13.1) + 0.04 * Math.sin(t * 2.3);
    let el = (now - cycle) / 1000;
    if (el > REST + FLIP) { spread++; cycle = now; el = 0; }
    const flipU = !reduce && el > REST ? (el - REST) / FLIP : null;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(L.base, 0, 0);
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
    drawWeather(dt, t, now);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(L.frame, 0, 0);
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
    const TI = timeInfo();
    if (ENV.fire) { if (!reduce) stepFire(dt, f); drawFire(ctx, f); }
    if (TI.candles) { drawCandle(ctx, 1090, t, 0); drawCandle(ctx, 1440, t, 1); }
    drawClockHands(ctx);
    drawBook(ctx, spread, flipU);
    // свет лампы на книгу (лампу включают вечером и ночью)
    if (TI.lamp) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const B = LB.B;
    ctx.fillStyle = lin(ctx, 0, B[1], 0, 760, [[0, `rgba(${TH.lamp},0.10)`], [1, `rgba(${TH.lamp},0.02)`]]);
    poly(ctx, [[B[0] - 58, B[1] - 12], [B[0] + 58, B[1] + 14], [990, 770], [560, 770]]); ctx.fill();
    ctx.translate(785, 748); ctx.scale(1, 0.38);
    ctx.fillStyle = rad(ctx, 0, 0, 0, 300, [[0, `rgba(${TH.lamp},0.38)`], [0.5, `rgba(${TH.lamp},0.14)`], [1, `rgba(${TH.lamp},0)`]]);
    ctx.fillRect(-300, -300, 600, 600);
    ctx.restore();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(L.front, 0, 0);
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
    drawSteam(ctx, t);
    // отблески огня на комнату и вспышки молний
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    if (flash > 0) { ctx.fillStyle = `rgba(200,210,255,${flash * .16})`; ctx.fillRect(0, 0, VW, VH); }
    if (ENV.fire) {
    ctx.fillStyle = rad(ctx, FB.cx, 560, 0, 900, [[0, `rgba(${TH.glow},${0.1 * f * TH.glowK})`], [1, `rgba(${TH.glow},0)`]]); ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = rad(ctx, FB.cx, 670, 0, 380, [[0, `rgba(${TH.glow},${0.14 * f * TH.glowK})`], [1, `rgba(${TH.glow},0)`]]); ctx.fillRect(0, 0, VW, VH);
    }
    ctx.restore();
    if (fade) {
      const k = (now - fade.t0) / 1000;
      if (k >= 1) fade = null;
      else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 - k * k * (3 - 2 * k); ctx.drawImage(fade.img, 0, 0); ctx.globalAlpha = 1; }
    }
    if (!reduce && running) requestAnimationFrame(frame); else looping = false;
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    S = Math.max(w / VW, h / VH);
    ox = Math.min(0, Math.max(w - VW * S, w / 2 - 800 * S));   // на узком экране держим книгу в центре кадра
    oy = (h - VH * S) / 2;
    build();
    if (reduce) frame(performance.now());
  }
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  if (reduce) setInterval(() => frame(performance.now()), 30000);
  else { looping = true; requestAnimationFrame(t => { last = t; frame(t); }); }
  try { const st = JSON.parse(localStorage.getItem('kitobkhona-settings')); if (st && st.scene === false) running = false; } catch (e) {}
})();
</script>
</body>
</html>
