<style>
/* Ночная библиотека: дымчатые тёмные панели поверх комнаты, латунь лампы — акцент, бумага — только для чтения.
   Сцена всегда ночная, поэтому страница намеренно в одной (тёмной) теме. */
:root {
  --night: #0d0907;
  --panel: rgba(20, 14, 10, .78);
  --panel-solid: rgba(17, 12, 9, .96);
  --panel-hi: rgba(255, 226, 180, .06);
  --line: rgba(230, 190, 130, .16);
  --line-strong: rgba(230, 190, 130, .34);
  --ink: #f1e6d3; --muted: #b8a78d; --faint: #8b7b65;
  --brass: #d6a453; --brass-hi: #f2cd84; --brass-ink: #1d1206;
  --ember: #e07a3c; --leaf: #7dbb92; --danger: #ef8d77;
  --paper: #f2e7cf; --paper-ink: #2b2016; --paper-muted: #7a6a52;
  --mark: rgba(240, 186, 80, .55);
  --inset: rgba(0, 0, 0, .25); --bar: rgba(18, 12, 8, .9); --hero: linear-gradient(135deg, rgba(20, 14, 10, .86), rgba(20, 14, 10, .62)); --lead-ink: #e3d5bd;
  --radius: 16px;
  --display: Lora, Georgia, "Times New Roman", serif;
  --sans: "PT Sans", "Segoe UI", system-ui, sans-serif;
  --serif: "PT Serif", Georgia, serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font: 16px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: var(--brass-hi); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.05rem; color: var(--brass-hi); }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.eyebrow { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-weight: 700; margin-bottom: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- панели */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
  box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .8), inset 0 1px 0 var(--panel-hi); }
.block { padding: clamp(18px, 3vw, 28px); }
.block-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* ---------- кнопки и поля */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  font: 700 .95rem var(--sans); color: var(--brass-ink);
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); box-shadow: 0 6px 18px -8px rgba(214, 164, 83, .8), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .2s var(--ease), box-shadow .2s, filter .2s; }
.btn:hover { text-decoration: none; transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 10px 24px -8px rgba(214, 164, 83, .9), inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.ghost { background: rgba(255, 226, 180, .04); color: var(--ink); border: 1px solid var(--line-strong); box-shadow: none; }
.btn.ghost:hover { border-color: var(--brass); color: var(--brass-hi); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(239, 141, 119, .45); box-shadow: none; }
.btn.small { padding: 7px 12px; font-size: .85rem; }
.quiet { color: var(--muted); font-weight: 700; font-size: .92rem; }
.quiet:hover { color: var(--ink); }
.link { background: none; border: 0; color: var(--danger); cursor: pointer; font: inherit; font-size: .85rem; padding: 0 4px; }
input, textarea, select { width: 100%; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 10px;
  font: inherit; background: var(--inset); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(214, 164, 83, .2); }
label { display: block; font-weight: 700; font-size: .92rem; color: var(--muted); }
label input, label textarea, label select { margin-top: 6px; font-weight: 400; font-size: 1rem; }
label.check { display: flex; gap: 10px; align-items: center; font-weight: 400; color: var(--ink); }
label.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--brass); }
.form { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; }

.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--inset); border: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; color: var(--muted); font: 700 .88rem var(--sans); padding: 7px 14px; border-radius: 9px; cursor: pointer; transition: background .25s, color .25s; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { background: var(--brass); color: var(--brass-ink); }

/* ---------- шапка и поиск */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; border-bottom: 1px solid var(--line-strong);
  background: var(--bar);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.topbar-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "logo search nav"; gap: 12px 24px; align-items: center; padding-block: 12px; }
.logo { grid-area: logo; display: flex; align-items: center; gap: 10px; color: var(--ink); font: 700 1.35rem var(--display); }
.logo svg { color: var(--brass); }
.logo:hover { text-decoration: none; }
.search { grid-area: search; position: relative; max-width: 560px; width: 100%; justify-self: center; }
.search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input { padding-left: 42px; border-radius: 999px; background: var(--inset); }
nav { grid-area: nav; display: flex; gap: 14px; align-items: center; justify-self: end; }
.me { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-strong);
  background: rgba(255, 226, 180, .04); color: var(--ink); cursor: pointer; font-size: 1.05rem; transition: border-color .2s, background .2s; }
.icon-btn:hover { border-color: var(--brass); background: rgba(214, 164, 83, .12); }

.suggest { position: absolute; top: calc(100% + 8px); left: 0; right: 0; padding: 8px; border-radius: 14px;
  background: var(--panel-solid); border: 1px solid var(--line-strong); box-shadow: 0 24px 60px -12px rgba(0, 0, 0, .9);
  max-height: min(70vh, 460px); overflow-y: auto; opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top center;
  transition: opacity .16s ease, transform .2s var(--ease); }
.suggest.open { opacity: 1; transform: none; }
.sg-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; }
.sg { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); }
.sg:hover, .sg.active { background: rgba(214, 164, 83, .14); text-decoration: none; }
.sg .mini { width: 26px; height: 36px; border-radius: 2px 5px 5px 2px; flex: none; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: inset 2px 0 0 rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(242, 205, 132, .3); }
.sg .who { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgba(214, 164, 83, .18); color: var(--brass-hi); font: 700 .95rem var(--display); }
.sg .txt { display: flex; flex-direction: column; min-width: 0; }
.sg .txt b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg .txt span { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg b mark { background: none; color: var(--brass-hi); }
.sg.all { color: var(--brass-hi); font-weight: 700; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; }

/* ---------- главная */
main { position: relative; z-index: 1; padding-block: 28px 8px; display: flex; flex-direction: column; gap: 22px; transition: opacity .5s ease; }
.hero { max-width: 620px; padding: clamp(22px, 4vw, 38px); display: flex; flex-direction: column; gap: 16px;
  background: var(--hero); }
.hero h1 em { font-style: italic; color: var(--brass-hi); }
.lead { font-size: 1.06rem; color: var(--lead-ink); max-width: 62ch; }
.try { font-size: .92rem; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink); font-size: .88rem; transition: border-color .2s, background .2s; }
.chip:hover { text-decoration: none; border-color: var(--brass); background: rgba(214, 164, 83, .12); }

/* ---------- обложки и полка */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 28px 20px; }
.shelf.row-scroll { grid-auto-flow: column; grid-auto-columns: 138px; grid-template-columns: none; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
.shelf.row-scroll > * { scroll-snap-align: start; }
.work { display: flex; flex-direction: column; gap: 8px; color: var(--ink); min-width: 0; }
.work:hover { text-decoration: none; }
.wt { font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wm { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.cover { position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 9px 9px 3px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 18% 13%; color: #f0d79f;
  background: linear-gradient(90deg, rgba(0, 0, 0, .45) 0 5%, rgba(255, 255, 255, .1) 6.5%, rgba(0, 0, 0, 0) 13%), linear-gradient(160deg, var(--c1), var(--c2));
  box-shadow: 0 16px 26px -12px rgba(0, 0, 0, .9), inset -1px 0 0 rgba(255, 255, 255, .08);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.cover::before { content: ""; position: absolute; inset: 7% 9% 7% 12%; border: 1px solid rgba(242, 205, 132, .45); border-radius: 2px;
  box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .18), inset 0 0 0 4px rgba(242, 205, 132, .18); pointer-events: none; }
.cover .ct { position: relative; font: 600 .95rem/1.25 var(--display); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cover .orn { position: relative; width: 26px; height: 7px; margin: 10px 0; background: radial-gradient(circle, currentColor 1.6px, transparent 2px) center / 9px 7px repeat-x; opacity: .7; }
.cover .ca { position: relative; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.cover .ribbon { position: absolute; top: 0; right: 16%; background: var(--ember); color: #fff3e3; font: 700 .58rem var(--sans); letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 4px 9px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); }
.cover.big { width: 200px; margin: 0 auto; }
.cover.big .ct { font-size: 1.3rem; }
.cover.big .ca { font-size: .72rem; }
.work:hover .cover, .work:focus-visible .cover { transform: translateY(-6px) rotate(-1.2deg); box-shadow: 0 26px 30px -14px rgba(0, 0, 0, .95), 0 0 0 1px rgba(242, 205, 132, .4), 0 0 30px -6px rgba(242, 180, 90, .35); }

.authors { display: flex; flex-wrap: wrap; gap: 10px; }
.author { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--inset);
  border-radius: 999px; padding: 6px 16px 6px 6px; color: var(--ink); transition: border-color .2s, background .2s; }
.author:hover { text-decoration: none; border-color: var(--brass); background: rgba(214, 164, 83, .1); }
.avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: inline-grid; place-items: center;
  background: linear-gradient(160deg, var(--brass-hi), #9a6b2a); color: var(--brass-ink); font: 700 .95rem var(--display); }
.big-avatar { width: 96px; height: 96px; font-size: 2.4rem; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line-strong); border-radius: 12px; text-align: center; grid-column: 1 / -1; }

/* ---------- страница книги / классики */
.detail { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; align-items: start; }
.detail-side { padding: 22px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(96px + env(safe-area-inset-top, 0px)); }
.detail-main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: .9rem; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; color: var(--ink); }
.sub { color: var(--muted); font-size: 1.02rem; margin-top: 6px; }
.stars { display: flex; align-items: center; gap: 2px; }
.stars span { margin-right: 8px; color: var(--muted); font-size: .9rem; }
.stars button { background: none; border: 0; font-size: 1.5rem; color: rgba(242, 205, 132, .25); cursor: pointer; padding: 0 2px; transition: color .15s, transform .15s; }
.stars button.on, .stars button:hover { color: var(--brass-hi); }
.stars button:hover { transform: scale(1.15); }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- ИИ-разбор */
.brief-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brief-head h2 { display: flex; align-items: center; gap: 10px; }
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; }
.brief-grid > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.points li { position: relative; padding-left: 24px; }
.points li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; background: var(--brass); transform: rotate(45deg); }
.points strong, .lead strong, .why strong, .facts-table strong { color: var(--brass-hi); background: linear-gradient(transparent 62%, rgba(214, 164, 83, .28) 62%); }
.why { padding: 12px 16px; border-left: 3px solid var(--leaf); background: rgba(125, 187, 146, .08); border-radius: 0 10px 10px 0; }
.facts-table { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
.facts-table th, .facts-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.facts-table th { color: var(--brass); font-weight: 700; width: 40%; }
.facts-table tr:last-child th, .facts-table tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--inset); }
.quote { margin: 0; padding: 16px 18px; border-radius: 10px; background: var(--paper); color: var(--paper-ink); font: 1.02rem/1.7 var(--serif); }
.quote mark { background: linear-gradient(transparent 50%, var(--mark) 50%); color: inherit; white-space: pre-line; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.quote p { margin-top: 8px; font: .9rem/1.5 var(--sans); color: var(--paper-muted); }
.quote small { font: .78rem var(--sans); color: var(--paper-muted); }
.note { margin-top: 16px; font-size: .85rem; color: var(--faint); }
.thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 10px 0; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

/* ---------- читалка */
.book-head { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 26px; align-items: start; }
.book-head .cover.big { width: 150px; }
.book-head .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.reader-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.paper { position: relative; border-radius: 6px 6px 12px 12px; padding: clamp(22px, 5vw, 52px); color: var(--paper-ink);
  background: radial-gradient(ellipse 90% 60% at 50% -5%, #fff7df, rgba(255, 247, 223, 0) 70%), var(--paper);
  box-shadow: 0 30px 60px -24px rgba(0, 0, 0, .9), 0 0 0 1px rgba(120, 90, 50, .25), 0 0 80px -20px rgba(255, 200, 120, .25); }
.paper-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid rgba(90, 64, 34, .2); font: .9rem var(--sans); color: var(--paper-muted); }
.paper-bar .btn.ghost { color: var(--paper-ink); border-color: rgba(90, 64, 34, .35); background: transparent; }
.paper-bar .btn.ghost:hover { border-color: var(--paper-ink); }
.text { font: 1.14rem/1.85 var(--serif); max-width: 64ch; }
.text p { white-space: pre-line; margin: 0 0 1em; }
.text.poem { font-style: italic; }
.text mark.key { background: linear-gradient(transparent 52%, var(--mark) 52%); color: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hint { font-size: .85rem; color: var(--paper-muted); font-family: var(--sans); }
.explain { position: absolute; z-index: 6; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); animation: pop .25s var(--ease) both; }
.assistant { position: sticky; top: calc(96px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.chat { height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
.msg { padding: 10px 13px; border-radius: 12px; max-width: 92%; font-size: .93rem; overflow-wrap: anywhere; animation: pop .3s var(--ease) both; }
.msg.bot { background: rgba(255, 226, 180, .07); border: 1px solid var(--line); align-self: flex-start; }
.msg.user { background: var(--brass); color: var(--brass-ink); align-self: flex-end; }
.sources { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; }
.sources small { color: var(--muted); }
.selected { font-size: .85rem; background: rgba(214, 164, 83, .14); border-radius: 8px; padding: 8px 10px; }
#askForm { display: flex; gap: 6px; }
.comment { border-top: 1px solid var(--line); padding: 12px 0; }
.comment p { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.comment-form { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; margin: 14px 0; }
.meta { color: var(--muted); font-size: .85rem; }
.passage { display: block; color: var(--ink); padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--inset); transition: border-color .2s; }
.passage:hover { text-decoration: none; border-color: var(--brass); }
.passage + .passage { margin-top: 10px; }

/* ---------- написать */
.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kind { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--inset); cursor: pointer; transition: border-color .2s, background .2s, transform .2s var(--ease); }
.kind input { position: absolute; opacity: 0; pointer-events: none; }
.kind b { font: 600 1.1rem var(--display); color: var(--ink); }
.kind span { font-size: .82rem; color: var(--muted); font-weight: 400; }
.kind:hover { border-color: var(--brass); }
.kind:has(input:checked) { border-color: var(--brass); background: rgba(214, 164, 83, .14); transform: translateY(-2px); }
.kind:has(input:focus-visible) { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
textarea.paper-input { background: var(--paper); color: var(--paper-ink); font: 1.08rem/1.8 var(--serif); border-color: rgba(120, 90, 50, .4); min-height: 320px; resize: vertical; }
textarea.paper-input::placeholder { color: #a8977a; }
.form-card { max-width: 460px; width: 100%; margin: 24px auto; }
.profile-head { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.profile-head > div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }

/* ---------- переход на проверенный сайт */
.site-best { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin: 14px 0 12px; border-radius: 14px; color: var(--ink);
  border: 1px solid var(--brass); background: linear-gradient(90deg, rgba(214, 164, 83, .18), rgba(214, 164, 83, .05));
  transition: transform .25s var(--ease), box-shadow .25s; }
.site-best:hover { text-decoration: none; transform: translateY(-2px); box-shadow: 0 12px 30px -12px rgba(214, 164, 83, .6); }
.site-best .lock { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(125, 187, 146, .16); font-size: 1.1rem; }
.site-best .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.site-best .txt b { font: 600 1.1rem var(--display); }
.site-best .txt span { font-size: .85rem; color: var(--muted); }
.site-best .go { font-weight: 700; color: var(--brass-hi); white-space: nowrap; }
.sg.site { color: var(--leaf); }
.sg.site:hover { text-decoration: none; }

/* ---------- массовый импорт и вся библиотека */
.drop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.drop label { padding: 16px; border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--inset); }
.tpl summary { cursor: pointer; color: var(--brass-hi); font-weight: 700; }
.tpl pre { margin: 12px 0; padding: 14px; border-radius: 10px; background: var(--inset); border: 1px solid var(--line); overflow-x: auto; font: .82rem/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8dcc6; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: .88rem; font-variant-numeric: tabular-nums; }
.stat b { color: var(--brass-hi); }
.stat.bad b { color: var(--danger); }
.preview { width: 100%; border-collapse: collapse; font-size: .88rem; }
.preview th, .preview td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.preview th { color: var(--brass); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
.progress { height: 10px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); transition: width .2s; }
.pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- профили и люди */
.avatar { overflow: hidden; }
img.avatar { object-fit: cover; background: rgba(0, 0, 0, .3); padding: 0; }
.avatar.lg { width: 76px; height: 76px; font-size: 1.9rem; }
.avatar.huge { width: 132px; height: 132px; font-size: 3.2rem; }
.avatar.ring { box-shadow: 0 0 0 4px #17100b, 0 0 0 6px var(--brass), 0 20px 40px -10px rgba(0, 0, 0, .85); }
.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .05em; border: 1px solid; vertical-align: middle; }
.badge.role-teacher { color: var(--brass-hi); border-color: rgba(214, 164, 83, .5); background: rgba(214, 164, 83, .12); }
.badge.role-student { color: var(--leaf); border-color: rgba(125, 187, 146, .45); background: rgba(125, 187, 146, .1); }
.profile-card { overflow: hidden; }
.banner { height: 160px; animation: bannerIn 1s var(--ease) both;
  background: radial-gradient(circle at 18% -10%, rgba(255, 226, 180, .22), transparent 55%), repeating-linear-gradient(135deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 14px), linear-gradient(120deg, var(--c1), var(--c2)); }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.06); } }
.profile-main { position: relative; display: flex; gap: 8px 24px; align-items: flex-start; flex-wrap: wrap; padding: 0 clamp(18px, 3vw, 28px); margin-top: -66px; }
.profile-main > .pinfo, .profile-main > .pactions { margin-top: 80px; }
.profile-main > .avatar { animation: avatarIn .75s .15s var(--ease) both; }
@keyframes avatarIn { from { opacity: 0; transform: translateY(24px) scale(.85); } }
.pinfo { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
.pactions { padding-bottom: 6px; }
.pstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-top: 24px; background: var(--line); border-top: 1px solid var(--line); }
.pstat { background: var(--inset); padding: 16px clamp(14px, 2vw, 22px); display: flex; flex-direction: column; gap: 2px; }
.pstat b { font: 600 1.7rem var(--display); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.pstat span { font-size: .8rem; color: var(--muted); }
.tab-body { animation: pop .4s var(--ease) both; }
.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.person-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 22px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--inset); color: var(--ink); transition: transform .3s var(--ease), border-color .3s, box-shadow .3s;
  animation: rise .55s var(--ease) both; animation-delay: calc(120ms + var(--i, 0) * 50ms); }
.person-card:hover { text-decoration: none; transform: translateY(-4px); border-color: var(--brass); box-shadow: 0 18px 40px -18px rgba(214, 164, 83, .55); }
.person-card .avatar { box-shadow: 0 0 0 3px rgba(214, 164, 83, .35); transition: transform .3s var(--ease); }
.person-card:hover .avatar { transform: scale(1.06); }
.person-card b { font: 600 1.05rem var(--display); }
.pc-sub { font-size: .8rem; color: var(--muted); line-height: 1.35; }
#app.still .person-card { animation: none; }
.c-head { display: flex; gap: 10px; align-items: center; }
.form-card.wide { max-width: 760px; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kinds.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field-label { font-weight: 700; font-size: .92rem; color: var(--muted); }
.avatar-edit { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
#avPreview > .avatar { animation: pop .45s var(--ease) both; }
.file-btn { cursor: pointer; }
.file-btn input { display: none; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.swatch { width: 48px; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; background: linear-gradient(120deg, var(--c1), var(--c2)); transition: transform .2s var(--ease), border-color .2s; }
.swatch:hover { transform: translateY(-2px); }
.swatch.on { border-color: var(--brass-hi); transform: translateY(-3px); }

/* ---------- проверка оригинальности */
.check-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
.scan-paper { overflow: hidden; max-height: 480px; }
.scan-paper .text { font-size: .98rem; line-height: 1.7; white-space: pre-line; }
.scan-paper::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(rgba(242, 231, 207, 0), var(--paper)); pointer-events: none; }
.scanline { position: absolute; left: 0; right: 0; top: 0; height: 70px; pointer-events: none;
  background: linear-gradient(180deg, rgba(214, 164, 83, 0), rgba(214, 164, 83, .28) 85%, rgba(242, 205, 132, .95) 88%, rgba(214, 164, 83, 0) 92%); animation: scan 2.2s ease-in-out infinite; }
.scan-paper.done .scanline { opacity: 0; transition: opacity .5s; animation-play-state: paused; }
@keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(500px); } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--inset); transition: opacity .3s, border-color .3s; }
.step[data-s="wait"] { opacity: .45; }
.step[data-s="run"] { border-color: var(--brass); }
.step .ic { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; border: 2px solid var(--line-strong); color: var(--muted); }
.step[data-s="run"] .ic { border-color: var(--brass); border-top-color: transparent; animation: spin .8s linear infinite; }
.step[data-s="ok"] .ic { background: var(--leaf); border-color: var(--leaf); color: #0d1a12; animation: pop .35s var(--ease) both; }
.step[data-s="warn"] .ic { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); animation: pop .35s var(--ease) both; }
.step[data-s="bad"] .ic { background: var(--danger); border-color: var(--danger); color: #2a0c06; animation: pop .35s var(--ease) both; }
.step[data-s="skip"] .ic { border-style: dashed; }
.step b { display: block; }
.step small { display: block; margin-top: 2px; color: var(--muted); font-size: .85rem; animation: pop .35s var(--ease) both; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; padding: 20px; border-radius: 14px; border: 1px solid var(--vc); }
.v-ok { --vc: var(--leaf); background: rgba(125, 187, 146, .08); }
.v-warn { --vc: var(--brass); background: rgba(214, 164, 83, .08); }
.v-block { --vc: var(--danger); background: rgba(239, 141, 119, .08); }
.ring { position: relative; width: 124px; height: 124px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: rgba(255, 255, 255, .08); }
.ring .bar { stroke: var(--vc); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); animation: ring 1.3s var(--ease) both; }
@keyframes ring { from { stroke-dashoffset: 100; } }
.ring span { font: 600 1.7rem var(--display); margin-top: -12px; font-variant-numeric: tabular-nums; }
.ring small { position: absolute; bottom: 32px; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.match { padding: 10px 12px; border-radius: 10px; background: var(--inset); border: 1px solid var(--line); font-size: .9rem; }
.match q { display: block; margin-top: 4px; color: var(--muted); font-style: italic; quotes: "«" "»"; }
.orig { display: inline-block; }
.orig summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700; border: 1px solid; }
.orig summary::-webkit-details-marker { display: none; }
.orig.ok summary { color: var(--leaf); border-color: rgba(125, 187, 146, .5); background: rgba(125, 187, 146, .1); }
.orig.warn summary { color: var(--brass-hi); border-color: rgba(214, 164, 83, .5); background: rgba(214, 164, 83, .1); }
.orig-body { margin-top: 8px; max-width: 60ch; font-size: .88rem; color: var(--muted); animation: pop .3s var(--ease) both; }
.tick { color: var(--leaf); }

/* ---------- темы (на body, чтобы не спорить с темой самого просмотрщика) */
body[data-skin="green"] { --brass: #7cc49a; --brass-hi: #a8e2c0; --brass-ink: #0b1a11; --panel: rgba(10, 20, 14, .8); --panel-solid: rgba(9, 17, 12, .96);
  --line: rgba(140, 210, 170, .16); --line-strong: rgba(140, 210, 170, .32); --ink: #e7efe7; --muted: #a3b8a8; --faint: #7a9182; --bar: rgba(9, 17, 12, .9); --hero: linear-gradient(135deg, rgba(10, 20, 14, .88), rgba(10, 20, 14, .62)); --lead-ink: #d5e3d8; }
body[data-skin="midnight"] { --night: #070b16; --brass: #8fb0ff; --brass-hi: #bcd0ff; --brass-ink: #0a1020; --panel: rgba(12, 18, 34, .84); --panel-solid: rgba(10, 15, 28, .97);
  --line: rgba(150, 180, 255, .16); --line-strong: rgba(150, 180, 255, .32); --ink: #e6ebf7; --muted: #9aa6c2; --faint: #6f7a95; --leaf: #7fd1b0; --bar: rgba(9, 13, 25, .92); --hero: linear-gradient(135deg, rgba(12, 18, 34, .9), rgba(12, 18, 34, .65)); --lead-ink: #cdd6ec; --mark: rgba(143, 176, 255, .45); }
body[data-skin="parchment"] { --night: #e8dcc2; --panel: rgba(251, 246, 234, .9); --panel-solid: rgba(251, 246, 234, .98); --panel-hi: rgba(255, 255, 255, .6);
  --line: rgba(90, 64, 34, .16); --line-strong: rgba(90, 64, 34, .3); --ink: #2b2016; --muted: #6c5c46; --faint: #8e7f68; --brass: #8a5a14; --brass-hi: #7a4c0c; --brass-ink: #fff8ea;
  --leaf: #2f7a4e; --danger: #b3412f; --inset: rgba(90, 64, 34, .06); --bar: rgba(251, 246, 234, .94); --hero: linear-gradient(135deg, rgba(251, 246, 234, .95), rgba(251, 246, 234, .8)); --lead-ink: #3e3122; color-scheme: light; }
body[data-skin="parchment"] { background: radial-gradient(ellipse at 50% 0, #f6efdf, #e3d5b8 70%) fixed, var(--night); }
body[data-skin="parchment"] .btn:not(.ghost):not(.danger) { background: linear-gradient(180deg, #a87322, var(--brass)); }
body[data-skin="parchment"] .cover { color: #f0d79f; }
body[data-skin="midnight"].no-scene, body[data-skin="green"].no-scene, body[data-skin="fireplace"].no-scene { background: radial-gradient(ellipse at 50% -10%, var(--panel), var(--night) 70%) fixed, var(--night); }
body.no-scene #scene { display: none; }
body { transition: background-color .4s; }
.panel, .topbar, .tabs, input, textarea, select { transition: background-color .4s, border-color .4s, color .4s; }

/* ---------- режим чтения */
body.reading #scene { filter: brightness(.28) saturate(.7); transition: filter .6s; }
body.reading .book-head, body.reading .assistant, body.reading #comments, body.reading #briefPanel { display: none !important; }
body.reading .reader-layout { grid-template-columns: minmax(0, 1fr); max-width: 860px; width: 100%; margin: 0 auto; }
body.reading .paper { padding: clamp(26px, 6vw, 70px); }
.text { font-family: var(--read-font, var(--serif)) !important; font-size: var(--read-size, 1.14rem) !important; }
textarea.paper-input, .quote { font-family: var(--read-font, var(--serif)); }

/* ---------- панель настроек */
.shade { position: fixed; inset: 0; z-index: 20; background: rgba(5, 3, 2, .55); opacity: 0; transition: opacity .3s; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.shade.open { opacity: 1; }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); display: flex; flex-direction: column;
  background: var(--panel-solid); border-left: 1px solid var(--line-strong); box-shadow: -30px 0 60px -20px rgba(0, 0, 0, .8);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(102%); transition: transform .36s var(--ease); }
.drawer.open { transform: none; }
.set-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.set-body { overflow-y: auto; padding: 8px 20px 30px; display: flex; flex-direction: column; }
.set-sec { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.set-sec:last-child { border-bottom: 0; }
.set-sec h3 { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-family: var(--sans); color: var(--brass); }
.set-me { display: flex; gap: 14px; align-items: center; }
.set-me > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.set-me small { overflow: hidden; text-overflow: ellipsis; }
.skins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.skin { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--ink); cursor: pointer; text-align: left; transition: border-color .2s, transform .2s var(--ease); }
.skin:hover { transform: translateY(-2px); }
.skin.on { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass) inset; }
.skin b { font: 600 .95rem var(--display); }
.skin small { font-size: .74rem; color: var(--muted); }
.sk-prev { display: flex; gap: 4px; width: 100%; height: 34px; padding: 6px; border-radius: 8px; background: var(--bg); margin-bottom: 6px; }
.sk-prev i { flex: 1; border-radius: 4px; background: var(--a); opacity: .9; }
.sk-prev i:nth-child(2) { opacity: .5; } .sk-prev i:nth-child(3) { opacity: .25; }
.toggle { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; color: var(--ink); font-weight: 400; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.knob { width: 44px; height: 26px; flex: none; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .25s; margin-top: 2px; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.toggle input:checked + .knob { background: var(--brass); }
.toggle input:checked + .knob::after { transform: translateX(18px); }
.toggle input:focus-visible + .knob { outline: 2px solid var(--brass-hi); outline-offset: 3px; }
.tl { display: flex; flex-direction: column; gap: 2px; }
.tl small { color: var(--muted); font-size: .8rem; }
.fonts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.font { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--ink); cursor: pointer; }
.font span { font-size: 1.15rem; }
.font small { font: .62rem var(--sans); color: var(--muted); white-space: nowrap; }
.font.on { border-color: var(--brass); background: rgba(214, 164, 83, .14); }
.range { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
.range input { width: 100%; padding: 0; accent-color: var(--brass); border: 0; background: none; box-shadow: none; }
.font-sample { padding: 12px 14px; border-radius: 10px; background: var(--paper); color: var(--paper-ink); font-family: var(--read-font, var(--serif)); font-size: var(--read-size, 18px); line-height: 1.6; }
.sounds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.snd { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--ink); cursor: pointer; text-align: left; font: inherit; transition: border-color .2s, background .2s; }

.eq i { width: 3px; height: 30%; background: var(--brass-hi); border-radius: 2px; }

@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.strength { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 4px; align-items: center; margin-top: -4px; }

/* ---------- профиль в стиле Instagram */

.ig-stats { display: flex; gap: 8px 28px; flex-wrap: wrap; color: var(--muted); }

.ig-highlights { display: flex; gap: 22px; overflow-x: auto; padding: 4px 2px 6px; }
.hl { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: var(--ink); cursor: pointer; font: .82rem var(--sans); flex: none;
  animation: pop .45s var(--ease) both; animation-delay: calc(200ms + var(--i, 0) * 70ms); }

  background: var(--line-strong); transition: transform .25s var(--ease), background .25s; }

  font: 700 .78rem var(--sans); letter-spacing: .1em; text-transform: uppercase; transition: color .2s, border-color .2s; }

}


/* ---------- чат */
.chat-wrap { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100vh - 140px); min-height: 460px; overflow: hidden; }

.cl-item time { font-size: .72rem; color: var(--faint); }
.unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #e0457b; color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; animation: pop .3s var(--ease) both; }
.nc { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; animation: pop .3s var(--ease) both; }
.nc-list { display: flex; flex-direction: column; max-height: 220px; overflow-y: auto; }

.nc-item:hover { text-decoration: none; background: var(--inset); }
.chat-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.cp-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cp-head > div, .cp-who > span:last-child { display: flex; flex-direction: column; }
.cp-who { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.cp-who:hover { text-decoration: none; }
.cp-head .back { display: none; }
.cp-msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.cp-start { margin: auto; }

.day-sep span { font-size: .72rem; color: var(--faint); padding: 3px 10px; border-radius: 999px; background: var(--inset); }
.bubble-row { display: flex; gap: 8px; align-items: flex-end; max-width: 78%; }

.b-av .avatar { width: 28px; height: 28px; font-size: .8rem; }
.bubble { padding: 9px 13px 6px; border-radius: 18px 18px 18px 6px; background: var(--inset); border: 1px solid var(--line); min-width: 0; }
.bubble p { white-space: pre-wrap; overflow-wrap: anywhere; }
.mine .bubble { border-radius: 18px 18px 6px 18px; background: linear-gradient(160deg, var(--brass-hi), var(--brass)); color: var(--brass-ink); border-color: transparent; }
.b-name { display: block; font-size: .75rem; font-weight: 700; margin-bottom: 2px; }

.cp-form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }

.demo-user { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--ink); cursor: pointer; font: inherit; font-size: .88rem; transition: border-color .2s; }
.demo-user:hover { border-color: var(--brass); }

@media (max-width: 760px) {
  .chat-wrap { grid-template-columns: minmax(0, 1fr); height: calc(100vh - 170px); }
  .chat-wrap.has-cur .chat-list { display: none; }

}

/* ---------- за окном */
.env-now { padding: 10px 12px; border-radius: 10px; background: var(--inset); font-size: .88rem; }
.env-now span:first-child { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--ink); cursor: pointer; font: 600 .84rem var(--sans); transition: border-color .2s, background .2s, transform .2s var(--ease); }
.chip-btn:hover { transform: translateY(-1px); border-color: var(--brass); }
.chip-btn.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
/* ---------- первая страница: презентация проекта */
html[lang="tg"] .motto-tr { display: none; }
body.on-landing .topbar, body.on-landing .footer, body.on-landing #roomOpen { display: none; }
body.on-landing main { padding-block: 0; gap: 0; }
html.snap { scroll-snap-type: y proximity; }
.landing { display: flex; flex-direction: column; --veil: 10, 6, 4; }
body.on-landing { overflow-x: clip; }
body[data-skin="parchment"] .landing { --veil: 251, 246, 234; }
/* вуаль за текстом обложки и финала: комната видна, текст читается */
.cover-slide::before, .enter-slide::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); z-index: -1; pointer-events: none; }
.cover-slide::before { background: linear-gradient(0deg, rgba(var(--veil), .9) 0%, rgba(var(--veil), .6) 38%, rgba(var(--veil), 0) 68%), linear-gradient(90deg, rgba(var(--veil), .6), rgba(var(--veil), 0) 62%); }
.enter-slide::before { background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(var(--veil), .85), rgba(var(--veil), .5) 60%, rgba(var(--veil), .15) 100%); }

.l-head { position: fixed; z-index: 6; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(10, 6, 4, .72), rgba(10, 6, 4, 0)); }
body[data-skin="parchment"] .l-head { background: linear-gradient(180deg, rgba(251, 246, 234, .9), rgba(251, 246, 234, 0)); }
.l-head .logo { color: var(--ink); }
.l-lang button { padding: 6px 10px; }
.l-progress { position: fixed; z-index: 7; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; }
.l-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brass), var(--ember)); }
.l-dots { position: fixed; z-index: 6; right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.l-dots a { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); transition: transform .25s var(--ease), background .25s; }
.l-dots a.on { background: var(--brass); transform: scale(1.5); }
.l-dots a span { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: .75rem; padding: 3px 9px; border-radius: 999px; background: var(--panel-solid); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s; }
.l-dots a:hover span, .l-dots a:focus-visible span { opacity: 1; }
.slide { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; scroll-snap-align: start; padding-block: 90px 40px; position: relative; }
.slide-card { width: 100%; padding: clamp(24px, 4.5vw, 56px); display: flex; flex-direction: column; gap: 20px; }
.slide-card.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.big-h { font-size: clamp(1.8rem, 3.6vw, 3rem); }
.chap { display: flex; align-items: center; gap: 12px; }
.chap-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--brass); font: 600 1rem var(--display); letter-spacing: 0; color: var(--brass-hi); }
.cover-slide { align-items: flex-end; padding-bottom: 12vh; }
.cover-text { max-width: 760px; display: flex; flex-direction: column; gap: 16px; text-shadow: 0 2px 24px rgba(0, 0, 0, .65); }
body[data-skin="parchment"] .cover-text { text-shadow: 0 1px 18px rgba(255, 250, 240, .9); }
.cover-text.center { margin: 0 auto; align-items: center; text-align: center; }
.mega { font-size: clamp(3.4rem, 11vw, 8.5rem); line-height: .95; letter-spacing: -.01em;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 70%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
  filter: drop-shadow(0 6px 30px rgba(0, 0, 0, .55)); }
.motto { font: italic 500 clamp(1.3rem, 2.4vw, 1.8rem) var(--display); color: var(--ink); }
.motto-tr { color: var(--muted); margin-top: -10px; }
.btn.big { padding: 14px 26px; font-size: 1.05rem; }
.scroll-hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); cursor: pointer; font: .78rem var(--sans); letter-spacing: .14em; text-transform: uppercase; }
.scroll-hint i { width: 22px; height: 34px; border: 2px solid currentColor; border-radius: 12px; position: relative; }
.scroll-hint i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px; border-radius: 2px; background: currentColor; animation: wheel 1.6s ease-in-out infinite; }
@keyframes wheel { 0% { opacity: 0; transform: translateY(-3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
/* обложка появляется сразу: заголовок «собирается» из света */
.cover-slide .eyebrow, .cover-slide .mega, .cover-slide .motto, .cover-slide .motto-tr, .cover-slide .lead, .cover-slide .row { animation: rise .9s var(--ease) both; }
.cover-slide .mega { animation: megaIn 1.3s var(--ease) both; animation-delay: .15s; }
.cover-slide .motto { animation-delay: .5s; } .cover-slide .motto-tr { animation-delay: .6s; } .cover-slide .lead { animation-delay: .75s; } .cover-slide .row { animation-delay: .9s; }
@keyframes megaIn { from { opacity: 0; letter-spacing: .25em; filter: blur(12px) drop-shadow(0 6px 30px rgba(0, 0, 0, .55)); } }
/* главы оживают, когда до них долистали (без этого они просто видны) */
.slide.play .slide-card { animation: slideIn .8s var(--ease) both; }
@keyframes slideIn { from { opacity: .2; transform: translateY(40px) scale(.98); } }
.slide.play .rv { animation: rise .7s var(--ease) both; animation-delay: calc(.25s + var(--d, 0) * .12s); }
.pains { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.slide.play .demo-verdict .bar { animation: ring 1.4s var(--ease) both; animation-delay: 2.7s; }
.ai-demo { display: grid; gap: 16px; }
.mini-paper { padding: 22px 26px; }
.mini-paper .text { font-size: 1.05rem !important; }
.chat-demo { display: flex; flex-direction: column; gap: 10px; }

.bubble.typing { padding: 12px 16px; }

.slide.play .chat-demo .d2 { animation: typing 1.6s var(--ease) both; animation-delay: 1s; }

.seasons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.mini-win { display: flex; flex-direction: column; gap: 8px; align-items: center; background: none; border: 0; color: var(--ink); cursor: pointer; font: 700 .92rem var(--sans); transition: transform .3s var(--ease); }
.mini-win:hover { transform: translateY(-4px); }
.mw-glass { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; border: 6px solid #5c3c24;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3), 0 14px 24px -12px rgba(0, 0, 0, .8); background: var(--sky); }
.mw-glass::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: var(--ground); border-radius: 50% 50% 0 0 / 30% 30% 0 0; }

/* ---------- живые детали: глубина комнаты, свет за курсором, наклон обложек, искры (всё выключается при «уменьшить движение») */
@property --lit { syntax: '<number>'; inherits: false; initial-value: 0; }
.panel, .topbar, .tabs, input, textarea, select { transition: background-color .4s, border-color .4s, color .4s, box-shadow .4s, --lit .45s ease; }
.fx-lit { background-image: radial-gradient(560px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 214, 150, calc(.075 * var(--lit))), transparent 45%); }
body[data-skin="parchment"] .fx-lit { background-image: radial-gradient(560px circle at var(--mx, 50%) var(--my, 50%), rgba(154, 106, 31, calc(.09 * var(--lit))), transparent 45%); }
.fx-lit.on { --lit: 1; }
.topbar.scrolled { box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .9); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 25; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  #scene { transition: filter .6s, scale 1.4s var(--ease); }
  body.room #scene { scale: 1.06; }
}
@media (pointer: fine) {
  #app.leaving { filter: blur(4px); transform: translateY(-10px) scale(.985); transition: opacity .17s ease, transform .17s ease, filter .17s ease; }
}
/* книги «встают на полку» */
@keyframes shelfIn { from { opacity: 0; transform: perspective(700px) translate3d(0, 28px, 0) rotateX(16deg) rotateY(-14deg); } }
.shelf > .work, #app .shelf.reshelf > .work { animation-name: shelfIn; transform-origin: 50% 100%; }
/* обложка наклоняется за курсором, по ней бежит блик */
.cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255, 246, 225, .34), rgba(255, 246, 225, 0) 55%); }
.work:hover .cover::after, .work:focus-visible .cover::after, .cover.big:hover::after { opacity: 1; }
.fx-tilt .work:hover .cover { transform: perspective(800px) translateY(-6px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .12s ease-out, box-shadow .35s var(--ease); }
.fx-tilt .cover.big:hover { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1.02); transition: transform .12s ease-out, box-shadow .35s var(--ease); }
/* волна от нажатия */
.rip-box { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.rip { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: radial-gradient(circle, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 68%); animation: rip .6s ease-out forwards; }
.btn.ghost .rip, .chip-btn .rip, .tabs .rip, .snd .rip, .skin .rip { background: radial-gradient(circle, rgba(242, 205, 132, .42), rgba(242, 205, 132, 0) 68%); }
@keyframes rip { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
/* «магнитная» главная кнопка */
.btn.big { transition: transform .2s var(--ease), box-shadow .2s, filter .2s, translate .35s var(--ease); }
/* ИИ думает: листается маленькая книжка */
.book-load { position: relative; width: 36px; height: 24px; flex: none; perspective: 140px; }
.book-load::before, .book-load::after { content: ""; position: absolute; top: 0; bottom: 0; width: 50%; background: var(--paper); border: 1.5px solid var(--brass); }
.book-load::before { left: 0; border-radius: 4px 0 0 4px; border-right-width: .75px; }
.book-load::after { right: 0; border-radius: 0 4px 4px 0; border-left-width: .75px; }
.book-load i { position: absolute; z-index: 1; top: 2px; bottom: 2px; left: 50%; width: calc(50% - 2px); border-radius: 0 3px 3px 0; transform-origin: 0 50%;
  background: repeating-linear-gradient(180deg, #fbf3e2 0 3px, #eadcc0 3px 4px); animation: pageFlip 1.6s ease-in-out infinite; }
.book-load i:nth-child(2) { animation-delay: .22s; } .book-load i:nth-child(3) { animation-delay: .44s; }
@keyframes pageFlip { 0%, 12% { transform: rotateY(0); } 62%, 100% { transform: rotateY(-180deg); } }
/* значки в шапке оживают при наведении */
#settingsOpen svg, .nav-chat svg, .logo svg { transition: transform .6s var(--ease); }
#settingsOpen:hover svg { transform: rotate(90deg); }
.nav-chat:hover svg { transform: translate(2px, -2px) rotate(-8deg); }
.logo:hover svg { transform: rotate(-8deg) scale(1.08); }
.logo circle { transition: filter .4s; }
.logo:hover circle { filter: drop-shadow(0 0 4px #ffd27a); }
.quill { font-style: normal; display: inline-block; transform-origin: 25% 90%; }
.write-btn:hover .quill { animation: quill .8s ease-in-out; }
@keyframes quill { 25% { transform: rotate(-14deg); } 55% { transform: rotate(10deg) translateX(1px); } 80% { transform: rotate(-4deg); } }
.candle { overflow: visible; }
.candle .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.6s ease-in-out infinite; }
.candle .glow { opacity: .35; transition: opacity .4s; }
#roomOpen:hover .candle .glow { opacity: .8; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 25% { transform: scale(.9, 1.08) rotate(-4deg); } 55% { transform: scale(1.05, .94) rotate(3deg); } 80% { transform: scale(.96, 1.04) rotate(-1deg); } }
/* оценка: звёзды подпрыгивают по очереди */
.stars button.fx-pop { animation: starPop .55s var(--ease) both; }
@keyframes starPop { 0% { transform: scale(.5) rotate(-25deg); } 60% { transform: scale(1.4) rotate(8deg); } 100% { transform: scale(1); } }
/* уведомление показывает, сколько ему осталось */
.toast { position: relative; overflow: hidden; }
.toast::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); transform-origin: left; opacity: .75; animation: toastBar 3.6s linear both; }
@keyframes toastBar { to { transform: scaleX(0); } }
/* первая страница: по названию пробегает золотой блик, номера глав «проявляются» */
.cover-slide .mega { background-image: linear-gradient(105deg, rgba(255, 248, 230, 0) 42%, rgba(255, 248, 230, .95) 50%, rgba(255, 248, 230, 0) 58%), linear-gradient(180deg, var(--brass-hi), var(--brass) 70%, var(--ember));
  background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; background-position: 94% 0, 0 0;
  animation: megaIn 1.3s var(--ease) .15s both, megaShine 7s ease-in-out 2.4s infinite; }
@keyframes megaShine { 0% { background-position: 94% 0, 0 0; } 24%, 100% { background-position: 6% 0, 0 0; } }
.slide.play .chap-n { animation: chapIn .7s var(--ease) .15s both; }
@keyframes chapIn { from { opacity: 0; transform: scale(.4) rotate(-120deg); } }
/* ссылка «к содержанию» для клавиатуры и экранных дикторов */
.skip-link { position: fixed; z-index: 30; left: 16px; top: -64px; padding: 10px 16px; border-radius: 10px; background: var(--panel-solid); color: var(--brass-hi); border: 1px solid var(--brass); transition: top .2s; }
.skip-link:focus { top: calc(env(safe-area-inset-top, 0px) + 10px); }
#app:focus { outline: none; }

/* ---------- окно входа: раскрытая книга под лампой и кнопка Google */
.auth-back { position: fixed; inset: 0; z-index: 22; display: grid; place-items: center; padding: 16px; background: rgba(5, 3, 2, .62);
  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); opacity: 0; transition: opacity .3s ease; }
.auth-back.open { opacity: 1; }

function idb() {

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

}
async function idbGet(key) {

}
async function idbSet(key, val) {
  const d = await idb();

}

const FIELD = {
  title: ['название', 'title', 'китоб', 'ном', 'name'], author: ['автор', 'author', 'муаллиф'], year: ['год', 'year', 'сол'],
  genre: ['жанр', 'genre'], kind: ['тип', 'kind', 'type', 'навъ'], lang: ['язык', 'lang', 'language', 'забон'],
  description: ['описание', 'description', 'тавсиф', 'аннотация'], file: ['файл', 'file'], url: ['ссылка', 'url', 'link', 'пайванд'], text: ['текст', 'text', 'матн']
};
function normalizeRow(row) {
  const low = Object.create(null);
  for (const [k, v] of Object.entries(row && typeof row === 'object' ? row : {})) low[String(k).trim().toLowerCase()] = v == null ? '' : String(v).trim();
  const get = f => { for (const k of FIELD[f]) if (low[k]) return low[k]; return ''; };
  const kr = get('kind').toLowerCase(), lr = get('lang').toLowerCase(), url = get('url');
  return {
    title: get('title').slice(0, 200), author: get('author').slice(0, 120), year: get('year').slice(0, 20), genre: get('genre').slice(0, 60),
    kind: /стих|шеър|poem|газал|рубо|руба/.test(kr) ? 'poem' : /эссе|essay|мақола|макола|статья/.test(kr) ? 'essay' : 'book',
    lang: /^(ru|рус)/.test(lr) ? 'ru' : /^(en|анг)/.test(lr) ? 'en' : 'tg',
    description: get('description').slice(0, 2000), file: get('file').slice(0, 260), url: /^https:\/\/[^\s"'<>]+$/i.test(url) ? url.slice(0, 2000) : '', text: get('text').slice(0, 2000000)
  };
}
function parseTable(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = ['\t', ';', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(c => c.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}
async function hashPw(pw) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kitob:' + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + pw; }
}
function nextId(kind) { db.seq[kind] = (db.seq[kind] || 0) + 1; return db.seq[kind]; }

function splitIntoChunks(pages, keepLines, maxChars = 900) {
  const out = [];
  pages.forEach((pageText, i) => {
    const paragraphs = pageText.replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    let buf = '';
    for (let p of paragraphs) {
      p = keepLines ? p.split('\n').map(l => l.trim().replace(/\s+/g, ' ')).join('\n') : p.split(/\s+/).join(' ');
      if (keepLines || (buf.length + p.length > maxChars && buf)) { if (buf) out.push([i + 1, buf]); buf = ''; }
      buf = (buf + ' ' + p).trim();
    }
    if (buf) out.push([i + 1, buf]);
  });
  return out;
}
function paginate(text, size = 1800) {
  if (text.includes('\f')) return text.split('\f').filter(p => p.trim());
  const pages = []; let cur = '';
  for (const para of text.replace(/\r/g, '').split(/\n\s*\n/)) {
    if (cur && cur.length + para.length > size) { pages.push(cur); cur = ''; }
    cur += (cur ? '\n\n' : '') + para;
  }
  if (cur.trim()) pages.push(cur);
  return pages.length ? pages : [''];
}
function addChunks(bookId, pages, keepLines) {
  for (const [page, text] of splitIntoChunks(pages, keepLines)) db.chunks.push({ id: nextId('chunks'), book_id: bookId, page, text });

const TJ_MAP = { 'ӣ': 'и', 'ӯ': 'у', 'ҳ': 'х', 'ҷ': 'ч', 'қ': 'к', 'ғ': 'г', 'ё': 'е', 'ъ': '', 'ь': '', 'й': 'и', 'э': 'е' };
const LAT = [['shch', 'щ'], ['sh', 'ш'], ['ch', 'ч'], ['zh', 'ж'], ['kh', 'х'], ['yo', 'е'], ['yu', 'ю'], ['ya', 'я'], ['ts', 'ц'], ['ou', 'у'],
  ['a', 'а'], ['b', 'б'], ['v', 'в'], ['g', 'г'], ['d', 'д'], ['e', 'е'], ['z', 'з'], ['i', 'и'], ['y', 'и'], ['k', 'к'], ['l', 'л'], ['m', 'м'], ['n', 'н'],
  ['o', 'о'], ['p', 'п'], ['r', 'р'], ['s', 'с'], ['t', 'т'], ['u', 'у'], ['f', 'ф'], ['h', 'х'], ['c', 'к'], ['j', 'ч'], ['q', 'к'], ['w', 'в'], ['x', 'кс']];
function norm(s) {
  let t = String(s || '').toLowerCase();
  if (/[a-z]/.test(t)) for (const [l, c] of LAT) t = t.split(l).join(c);
  t = t.replace(/[ӣӯҳҷқғёъьйэ]/g, ch => TJ_MAP[ch]);
  return t.replace(/[^a-zа-я0-9]+/g, ' ').trim();
}
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function matchScore(qTokens, words) {
  let total = 0;
  for (const qt of qTokens) {
    let best = 0;
    for (const w of words) {
      if (w === qt) best = Math.max(best, 3);
      else if (w.startsWith(qt)) best = Math.max(best, 2.4);
      else if (qt.length >= 4 && w.includes(qt)) best = Math.max(best, 1.5);
      else if (qt.length >= 4 && w.length >= qt.length - 1 && lev(qt, w.slice(0, qt.length)) <= (qt.length >= 7 ? 2 : 1)) best = Math.max(best, 1.1);
    }
    if (!best) return 0;
    total += best;
  }
  return total;
}
function searchAll(q) {
  const qt = norm(q).split(' ').filter(Boolean);
  if (!qt.length) return { classics: [], works: [], authors: [], people: [] };
  const words = s => norm(s).split(' ');
  const rank = (arr, text) => arr.map(x => ({ x, s: matchScore(qt, words(text(x))) })).filter(r => r.s > 0).sort((a, b) => b.s - a.s).map(r => r.x);
  const classics = rank(CATALOG, c => `${c.t} ${c.ru} ${c.a} ${c.al} ${c.g}`);
  const works = rank(db.books.map(bookRow), b => `${b.title} ${b.author} ${KIND[b.kind]} ${b.genre || ''} ${b.year || ''}`);
  const authorNames = [...new Set(CATALOG.map(c => c.a))].map(a => ({ name: a, n: CATALOG.filter(c => c.a === a).length, al: CATALOG.find(c => c.a === a).al }));
  const authors = rank(authorNames, a => `${a.name} ${a.al}`);
  const people = rank(db.users.map(u => ({ ...u, n_books: db.books.filter(b => b.user_id === u.id).length })), u => u.name);
  return { classics, works, authors, people };
}

// ------------------------------------------------------------------ ИИ: поиск по смыслу (TF-IDF по буквенным n-граммам)
const index = {
  dirty: true, chunks: [], idf: null, vecs: [],
  ngrams(text) {
    const counts = new Map();
    for (const w of text.toLowerCase().split(/\s+/).filter(Boolean)) {
      const s = ' ' + w + ' ';
      for (let n = 2; n <= 4; n++) {
        if (s.length < n) continue;
        for (let i = 0; i + n <= s.length; i++) { const g = s.slice(i, i + n); counts.set(g, (counts.get(g) || 0) + 1); }
      }
    }
    return counts;
  },
  vectorize(counts) {
    const v = new Map(); let norm2 = 0;
    for (const [g, c] of counts) {
      const idf = this.idf.get(g); if (!idf) continue;
      const w = (1 + Math.log(c)) * idf; v.set(g, w); norm2 += w * w;
    }
    norm2 = Math.sqrt(norm2) || 1;
    for (const [g, w] of v) v.set(g, w / norm2);
    return v;
  },
  build() {
    // при очень большой библиотеке поиск по смыслу работает по последним 30 000 фрагментам, чтобы не тормозить браузер
    this.chunks = db.chunks.slice(-30000).map(c => ({ ...c, title: (db.books.find(b => b.id === c.book_id) || {}).title || '' }));
    const docs = this.chunks.map(c => this.ngrams(c.text));
    const df = new Map();
    for (const d of docs) for (const g of d.keys()) df.set(g, (df.get(g) || 0) + 1);
    const n = docs.length;
    this.idf = new Map();
    for (const [g, f] of df) this.idf.set(g, Math.log((1 + n) / (1 + f)) + 1);
    this.vecs = docs.map(d => this.vectorize(d));
    this.dirty = false;
  },
  search(query, topK = 5, bookId = null) {
    if (this.dirty) this.build();
    if (!this.chunks.length || !query.trim()) return [];
    const q = this.vectorize(this.ngrams(query));
    const scored = this.vecs.map((v, i) => {
      let s = 0; for (const [g, w] of q) { const x = v.get(g); if (x) s += w * x; }
      return [s, i];
    }).sort((a, b) => b[0] - a[0]);
    const res = [];
    for (const [s, i] of scored) {
      const c = this.chunks[i];
      if (bookId != null && c.book_id !== bookId) continue;
      if (s <= 0.02) break;
      res.push({ ...c, score: Math.round(s * 1000) / 1000 });
      if (res.length >= topK) break;
    }
    return res;
  }
};

  'Место, где преподаватели публикуют свои книги, эссе и стихи, а студенты читают, обсуждают и разбираются в них вместе с ИИ.': ['Ҷое, ки омӯзгорон китобҳо, эссеҳо ва шеърҳои худро нашр мекунанд, донишҷӯён онҳоро мехонанд, муҳокима мекунанд ва бо зеҳни сунъӣ таҳлил менамоянд.', 'A place where teachers publish their books, essays and poems, and students read, discuss and explore them with AI.'],
